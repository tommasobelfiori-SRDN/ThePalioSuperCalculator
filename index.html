// Testi delle contrade (facoltativi): se compilati compaiono nella pagina di ciascuna contrada.
//   motto: una frase breve · storia: elenco di paragrafi (uno per riga)
const STORIE = {
  andromeda:  {motto:'', storia:[]},
  bosco:      {motto:'', storia:[]},
  giardini:   {motto:'', storia:[]},
  lago:       {motto:'', storia:[]},
  sagittario: {motto:'', storia:[]},
};
let contradaSel = null;       // id della contrada aperta (null = elenco delle contrade)

const plur = (n, uno, molti) => n===1 ? uno : molti;
// numeri della contrada ricavati dall'albo (ALBO): solo fatti già registrati
function contradaStats(cid){
  const palio  = ALBO.filter(r=>r.palio===cid).map(r=>r.anno);
  const drappo = ALBO.filter(r=>r.drappo===cid).map(r=>r.anno);
  const doppiette = ALBO.filter(r=>r.palio===cid && r.drappo===cid).map(r=>r.anno);
  // serie più lunga di vittorie nelle edizioni di fila
  const serie = key => {
    let best = [], cur = [];
    ALBO.forEach(r=>{ if(r[key]===cid){ cur.push(r.anno); if(cur.length>best.length) best = cur.slice(); } else cur = []; });
    return best;
  };
  const perNome = new Map();
  ALBO.forEach(r=>{ const n = r.cap[cid]; if(n){ if(!perNome.has(n)) perNome.set(n, []); perNome.get(n).push(r.anno); } });
  const capitani = [...perNome].map(([nome,anni])=>({nome, anni}));
  return {palio, drappo, doppiette, serieP:serie('palio'), serieD:serie('drappo'), capitani};
}
// quanti Palii, Drappi e titoli ha la contrada che ne ha di più
function recordTitoli(){
  const r = {p:0, d:0, t:0};
  ALBO_COLS.forEach(id=>{
    const s = contradaStats(id);
    r.p = Math.max(r.p, s.palio.length); r.d = Math.max(r.d, s.drappo.length); r.t = Math.max(r.t, s.palio.length+s.drappo.length);
  });
  return r;
}

function viewContrade(showResults){
  const c = contradaSel && state.contrade.find(x=>x.id===contradaSel);
  return c ? viewContrada(c, showResults) : viewContradeElenco(showResults);
}

// elenco: una scheda colorata per contrada
function viewContradeElenco(showResults){
  const ultimo = ALBO[ALBO.length-1];
  const cards = state.contrade.map(c=>{
    const s = contradaStats(c.id), cap = ultimo.cap[c.id];
    return `<button type="button" class="tcard" data-action="team" data-cid="${c.id}" style="${cVars(c)}">
      <span class="t-top"><span class="t-name"><i class="cdot"></i>${esc(c.nome)}</span>
        <span class="t-meta"><span class="chip" title="Palii vinti">${ic('trophy')}${s.palio.length}</span><span class="chip d" title="Drappi vinti">${ic('flag')}${s.drappo.length}</span><span class="t-go">${ic('arrow')}</span></span></span>
      ${cap?`<span class="t-sub">Capitano ${ultimo.anno}: ${esc(cap)}</span>`:''}
    </button>`;
  }).join('');
  const nP = ALBO.filter(r=>r.palio).length, nD = ALBO.filter(r=>r.drappo).length;
  const coda = showResults ? " e come sta andando quest'anno" : '';
  return `${viewHead('Esplora le <span class="g">contrade</span>', {eyebrow:'Palio Malaspina · '+state.contrade.length+' contrade'})}
  <p class="lead">Scegli una contrada per scoprire la sua bacheca, i capitani di ogni edizione${coda}.</p>
  <div class="tgrid">${cards}</div>
  <p class="hint">${ic('trophy')} Palii vinti · ${ic('flag')} Drappi vinti. ${ALBO.length} edizioni dal ${ALBO[0].anno}: ${nP} Palii e ${nD} Drappi assegnati.</p>`;
}

// scheda di una contrada
function viewContrada(c, showResults){
  const s = contradaStats(c.id), rec = recordTitoli(), tx = STORIE[c.id] || {};
  const nP = s.palio.length, nD = s.drappo.length, nT = nP + nD;
  const range = a => a.length>1 ? a[0]+'–'+a[a.length-1] : a[0];

  // in cima: elenco per passare da una contrada all'altra
  const salta = state.contrade.map(x=>
    `<button type="button" class="tchip${x.id===c.id?' on':''}" style="${cVars(x)}" data-action="team" data-cid="${x.id}"><i></i>${esc(x.nome)}</button>`).join('');

  // striscia con il nome
  const badge = [];
  if(nP && nP===rec.p) badge.push(['trophy','Più Palii vinti']);
  if(nD && nD===rec.d) badge.push(['flag','Più Drappi vinti']);
  if(nT && nT===rec.t) badge.push(['medal','Più titoli in totale']);
  const chips = `<span class="chip">${ic('trophy')}${nP} ${plur(nP,'Palio','Palii')}</span>`+
                `<span class="chip">${ic('flag')}${nD} ${plur(nD,'Drappo','Drappi')}</span>`+
                badge.map(([i,t])=>`<span class="chip ok">${ic('check')}${t}</span>`).join('');
  const hero = `<section class="chero" style="${cVars(c)}">
    <div class="chero-in">
      <div class="chero-k">Contrada</div>
      <h1 class="hero-name big"><i class="cdot"></i>${esc(c.nome)}</h1>
      ${tx.motto?`<p class="chero-motto">${esc(tx.motto)}</p>`:''}
      <div class="chips">${chips}</div>
    </div>
    <div class="chero-side"><b>${nT}</b><span>${plur(nT,'titolo','titoli')}</span></div>
  </section>`;

  // testo scritto a mano (facoltativo)
  const storia = (tx.storia && tx.storia.length)
    ? `<div class="card story"><div class="sectionTitle"><span class="st-ic">${ic('medal')}</span><h2>La storia</h2></div>${tx.storia.map(p=>`<p>${esc(p)}</p>`).join('')}</div>` : '';

  // bacheca: anni di Palio e Drappo + curiosità ricavate dall'albo
  const anni = (arr, cls) => arr.length ? arr.map(y=>`<span class="yr ${cls}">${y}</span>`).join('') : '<span class="muted">Nessuna vittoria finora</span>';
  const fatti = [];
  if(s.serieP.length>1) fatti.push(['trophy', `Serie più lunga di Palii: <b>${s.serieP.length} di fila</b> (${range(s.serieP)})`]);
  if(s.serieD.length>1) fatti.push(['flag', `Serie più lunga di Drappi: <b>${s.serieD.length} di fila</b> (${range(s.serieD)})`]);
  if(s.doppiette.length) fatti.push(['medal', `${plur(s.doppiette.length,'Doppietta','Doppiette')} Palio + Drappo: <b>${s.doppiette.length}</b> (${s.doppiette.join(' · ')})`]);
  const top = s.capitani.slice().sort((a,b)=>b.anni.length-a.anni.length)[0];
  if(top && top.anni.length>1) fatti.push(['users', `Capitano più presente: <b>${esc(top.nome)}</b> (${top.anni.length} edizioni: ${top.anni.join(' · ')})`]);
  const bacheca = `<div class="card hall-p">
    <div class="sectionTitle"><span class="st-ic">${ic('trophy')}</span><h2>Bacheca</h2></div>
    <div class="bk p"><div class="bk-h"><span class="bk-k">${ic('trophy')} Palio</span><b>${nP}</b></div><div class="yrs">${anni(s.palio,'p')}</div></div>
    <div class="bk d"><div class="bk-h"><span class="bk-k">${ic('flag')} Drappo</span><b>${nD}</b></div><div class="yrs">${anni(s.drappo,'d')}</div></div>
    ${fatti.length?`<ul class="facts">${fatti.map(([i,t])=>`<li>${ic(i)}<span>${t}</span></li>`).join('')}</ul>`:''}
  </div>`;

  // edizione in corso: solo se le classifiche sono visibili
  let edizione = '';
  const disputate = state.gare.filter(disputata).length;
  if(showResults && disputate){
    const rp = classifica('palio').find(e=>e.c.id===c.id), rd = classifica('drappo').find(e=>e.c.id===c.id);
    const vinte = state.gare.filter(g=>g.pos[c.id]===1);
    const podi = state.gare.filter(g=>g.pos[c.id]!=null && g.pos[c.id]<=3).length;
    const gareVinte = vinte.length
      ? vinte.map(g=>`<span class="wchip" style="${cVars(c)}">${esc(g.sport)}${g.categoria?` <span class="cwc">· ${esc(g.categoria)}</span>`:''}</span>`).join('')
      : '<span class="muted">Nessuna gara vinta in questa edizione.</span>';
    edizione = `<div class="card">
      <div class="sectionTitle"><span class="st-ic">${ic('chart')}</span><h2>Edizione ${EDIZIONE_CORRENTE}</h2></div>
      <div class="rankpair">
        <div class="rt p"><span class="k">${ic('trophy')}Palio</span><b>${rp.rank}º</b><span class="v">${fmtP(rp.val)} punti</span></div>
        <div class="rt d"><span class="k">${ic('flag')}Drappo</span><b>${rd.rank}º</b><span class="v">${fmtD(rd.val)} punti</span></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${vinte.length}</b><span>Gare vinte</span></div>
        <div class="stat"><b>${podi}</b><span>Podi</span></div>
        <div class="stat"><b>${disputate}</b><span>Gare disputate</span></div>
        ${showCoeff()?`<div class="stat"><b>×${fmtCoeff(c.coeff)}</b><span>Coefficiente</span></div>`:''}
      </div>
      <p class="wins-h">Gare vinte</p>
      <div class="wins">${gareVinte}</div>
    </div>`;
  }

  // capitani, dall'edizione più recente
  const linea = [...ALBO].reverse().map(r=>{
    const p = r.palio===c.id, d = r.drappo===c.id;
    const nota = p&&d ? 'Palio e Drappo' : p ? 'Palio' : d ? 'Drappo' : '';
    const icone = (p?ic('trophy'):'') + (d?ic('flag'):'');
    return `<li class="${p&&d?'pd':p?'p':d?'d':''}"><span class="y">${r.anno}</span><span class="n">${esc(r.cap[c.id]||'—')}</span>${nota?`<span class="tl-note">${icone}${nota}</span>`:''}</li>`;
  }).join('');
  const capitani = `<div class="card">
    <div class="sectionTitle"><span class="st-ic">${ic('users')}</span><h2>Capitani</h2><span class="pill">${s.capitani.length} in ${ALBO.length} edizioni</span></div>
    <ul class="tl">${linea}</ul>
  </div>`;

  return `<div class="tbar"><button type="button" class="btn sm" data-action="team-back">${ic('back')} Tutte le contrade</button><div class="tchips">${salta}</div></div>
  ${hero}${storia}
  <div class="grid2">${bacheca}${edizione}</div>
  ${capitani}`;
}

/* ===================== VISTA: GARE & INSERIMENTO ===================== */
const isMobile = () => window.innerWidth < 760;

// testata comune alle viste: sopratitolo + titolo grande (+ controlli a destra)
function viewHead(title, o){
  o = o||{};
  return `<div class="vhead">
    <div class="vh-l">
      <div class="eyebrow">${o.live?'<i class="dot"></i>':''}${esc(o.eyebrow||'Palio Malaspina 2026')}</div>
      <h1 class="vtitle">${title}</h1>
    </div>
    ${o.right?`<div class="vh-r">${o.right}</div>`:''}
  </div>`;
}
// avanzamento: una tacca per gara, accesa se disputata
function progressHTML(){
  const n = state.gare.length, d = state.gare.filter(disputata).length;
  const ticks = state.gare.map(g=>`<i${disputata(g)?' class="on"':''}></i>`).join('');
  return `<div class="prog"><div class="prog-k">Avanzamento</div><div class="prog-l"><b>${d}</b><span class="of">/ ${n}</span><span>gare disputate</span></div><div class="ticks" aria-hidden="true">${ticks}</div></div>`;
}
const resetBanner = () => (canEdit() && configModificata())
  ? `<div class="banner">${ic('alert')}<span>Configurazione modificata rispetto ai valori predefiniti.</span>
      <button class="btn sm" data-action="reset-all">Ripristina tutto</button></div>` : '';

// versione mobile: una scheda per gara (niente scroll orizzontale)
function viewGareMobile(){
  const C = state.contrade;
  let lastSport = null;
  const cards = state.gare.map((g,i)=>{
    const nd = !disputata(g);
    let hdr = '';
    if(g.sport !== lastSport){ lastSport = g.sport; hdr = `<div class="msport">${esc(g.sport)}</div>`; }
    const counts = {};
    C.forEach(c=>{ const p=g.pos[c.id]; if(p!=null) counts[p]=(counts[p]||0)+1; });
    const tipoSel = TIPI.map(t=>`<option ${g.tipo===t?'selected':''}>${t}</option>`).join('');
    const rows = C.map(c=>{
      const p = g.pos[c.id];
      const dup = p!=null && counts[p]>1;
      const opts = ['<option value="">—</option>'].concat([1,2,3,4,5].map(n=>
        `<option value="${n}" ${p===n?'selected':''}>${n}ª</option>`)).join('');
      const pts = p!=null ? `<b>${fmtP(puntiPalio(g,c.id))}</b> pt · Drappo ${fmtD(puntiDrappo(g,c.id))}` : '';
      return `<div class="mrow${dup?' dup':''}" style="${cVars(c)}">
        <span class="mname"><i></i>${esc(c.nome)}</span>
        <select class="cell pp${p!=null?p:0}" data-action="pos" data-gid="${g.id}" data-cid="${c.id}" aria-label="${esc(c.nome)}" ${ED()}>${opts}</select>
        <span class="mpts">${pts}</span>
      </div>`;
    }).join('');
    const label = esc(g.categoria) || esc(g.sport);
    return hdr + `<div class="gcard${nd?' nd':''}">
      <div class="gcard-head">
        <div class="gcard-title"><span class="gnum">${i+1}</span>${label}</div>
        <select class="tipo" data-action="tipo" data-gid="${g.id}" title="Tipo di punteggio" ${ED()}>${tipoSel}</select>
      </div>
      ${rows}
    </div>`;
  }).join('');
  return `${resetBanner()}
  ${viewHead('Gare &amp; <span class="g">Inserimento</span>', {eyebrow:'Pannello organizzatore'})}
  ${progressHTML()}
  ${cards}
  <p class="hint">Posizione 1ª–5ª per contrada. <b>—</b> = gara non disputata. Chi è assente va messo <b>5ª</b>. I pareggi sono consentiti.</p>`;
}

function viewGare(){
  if(isMobile()) return viewGareMobile();
  const {totP,totD} = calcola();
  const C = state.contrade;
  const head = C.map(c=>`<th class="chead" style="${cVars(c)}">
      <span class="cname">${esc(c.nome)}</span>
      <span class="cbar"></span>
      <span class="coeff">coeff. ${fmtCoeff(c.coeff)}</span></th>`).join('');
  let lastSport = null;
  const colCount = 2 + C.length;
  const rows = state.gare.map((g,i)=>{
    const nd = !disputata(g);
    // intestazione di sezione quando cambia lo sport
    let groupHdr = '';
    if(g.sport !== lastSport){
      lastSport = g.sport;
      groupHdr = `<tr class="grouprow"><td class="grouphdr" colspan="${colCount}"><span>${esc(g.sport)}</span></td></tr>`;
    }
    // rileva pareggi (stessa posizione su >1 contrada)
    const counts = {};
    C.forEach(c=>{ const p=g.pos[c.id]; if(p!=null) counts[p]=(counts[p]||0)+1; });
    const cells = C.map(c=>{
      const p = g.pos[c.id];
      const dup = p!=null && counts[p]>1;
      const opts = ['<option value="">—</option>'].concat([1,2,3,4,5].map(n=>
        `<option value="${n}" ${p===n?'selected':''}>${n}ª</option>`)).join('');
      const pts = p!=null ? `${fmtP(puntiPalio(g,c.id))}p · ${fmtD(puntiDrappo(g,c.id))}` : '';
      return `<td class="cell${dup?' dup':''}" ${dup?'title="Pareggio: stessa posizione su più contrade (consentito)"':''}>
        <select class="cell pp${p!=null?p:0}" data-action="pos" data-gid="${g.id}" data-cid="${c.id}" aria-label="${esc(c.nome)}, gara ${i+1}" ${ED()}>${opts}</select>
        <span class="cellpts">${pts}</span></td>`;
    }).join('');
    const tipoSel = TIPI.map(t=>`<option ${g.tipo===t?'selected':''}>${t}</option>`).join('');
    const label = esc(g.categoria) || esc(g.sport);
    return groupHdr + `<tr class="${nd?'nondisp':''}">
      <td class="colNum">${i+1}</td>
      <td class="colGara">
        <div class="gara-name">${label}</div>
        <select class="tipo" data-action="tipo" data-gid="${g.id}" title="Tipo di punteggio (n. contrade partecipanti / competizione)" ${ED()}>${tipoSel}</select>
      </td>
      ${cells}
    </tr>`;
  }).join('');
  const footP = state.contrade.map(c=>`<td><span class="tp">${fmtP(totP[c.id])}</span><span class="td">Dr. ${fmtD(totD[c.id])}</span></td>`).join('');
  const vnote = (cloudOn && !isAdmin)
    ? `<div class="viewer-note">${ic('eye')}<span><b>Sola visione</b> — i risultati li inserisce l'admin. La classifica si aggiorna da sola in tempo reale. (Sei l'organizzatore? Premi <b>Admin</b> in alto e inserisci la password.)</span></div>` : '';
  return `
  ${vnote}${resetBanner()}
  ${viewHead('Gare &amp; <span class="g">Inserimento</span>', {eyebrow:'Pannello organizzatore'})}
  ${progressHTML()}
  <div class="card flush">
    <div class="matrix-wrap">
      <table class="matrix">
        <thead><tr>
          <th class="colNum">#</th><th class="colGara">Gara / Tipo</th>${head}
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td class="colNum"></td><td class="colGara">Totali</td>${footP}
        </tr></tfoot>
      </table>
    </div>
    <p class="hint pad">Imposta la posizione 1ª–5ª di ogni contrada. <b>—</b> = gara non ancora disputata (esclusa da classifiche e grafici).
      Una contrada assente va messa <b>5ª</b>. I pareggi sono consentiti (cella evidenziata in ambra).
      Il <b>Tipo</b> indica quante contrade partecipano (Punti 5/4/3) o la competizione (B = Burraco, T = Gara torte).</p>
  </div>`;
}

/* ===================== VISTA: CLASSIFICHE ===================== */
// selettore Palio | Drappo (stesse viste della navigazione)
function tipoSwitch(tipo){
  return `<div class="seg" role="group" aria-label="Classifica">` +
    [['palio','Palio','trophy'],['drappo','Drappo','flag']].map(([id,l,i])=>
      `<button type="button" class="seg-b${tipo===id?' on':''}" data-action="nav" data-view="${id}">${ic(i)}${l}</button>`).join('') +
    `</div>`;
}
// striscia a due colori per ciascuna contrada in testa (tagli netti)
function stripeGrad(cs){
  const cols = cs.flatMap(c=>[c.c1, c.c2]), n = cols.length;
  return 'linear-gradient(90deg,' + cols.map((c,i)=>`${c} ${(i/n*100).toFixed(2)}% ${((i+1)/n*100).toFixed(2)}%`).join(',') + ')';
}

function viewClassifica(tipo, lab){
  const arr = classifica(tipo);
  const {disp} = calcola();
  const started = disp.length > 0;
  const isDr = tipo==='drappo';
  const fv = v => isDr ? fmtD(v) : fmtP(v);
  const max = Math.max(1, ...arr.map(e=>e.val));
  const lead = arr[0].val;
  const leaders = started ? arr.filter(e=>e.rank===1) : [];
  const runner = started ? arr.find(e=>e.rank>1) : null;

  // in testa: scheda con la striscia nei colori della contrada
  let hero;
  if(started){
    const multi = leaders.length>1;
    const names = leaders.map(e=>`<span class="ldr" style="${cVars(e.c)}"><i class="cdot"></i>${esc(e.c.nome)}</span>`).join('<span class="amp">&amp;</span>');
    hero = `<section class="hero" style="--hs:${stripeGrad(leaders.map(e=>e.c))}">
      <div class="hero-k"><span>${multi?'In testa a pari merito':'In testa'}</span><span class="pill ${isDr?'silver':'gold'}">${isDr?'Drappo':'Palio'}</span></div>
      <div class="hero-score"><b>${fv(lead)}</b><span>${isDr?'punti drappo':'punti'}</span></div>
      <div class="hero-name${multi?' multi':''}">${names}</div>
      <div class="hero-meta">${runner ? `<span>Vantaggio</span><b>+${fv(lead-runner.val)} su ${esc(runner.c.nome)}</b>` : ''}</div>
    </section>`;
  } else {
    hero = `<section class="hero idle">
      <div class="hero-k"><span>Si parte</span><span class="pill ${isDr?'silver':'gold'}">${isDr?'Drappo':'Palio'}</span></div>
      <div class="hero-name">Nessuna gara disputata</div>
      <div class="hero-meta">La classifica prenderà forma dopo le prime gare.</div>
    </section>`;
  }

  const rows = arr.map(e=>{
    const cls = !started ? '' : e.rank===1?' p1':e.rank===2?' p2':e.rank===3?' p3':'';
    const pct = started ? Math.max(3, e.val/max*100) : 0;
    const wc = state.gare.filter(g=>g.pos[e.c.id]===1).length;
    const gap = !started ? '' : (e.rank===1 ? '—' : '−'+fv(lead-e.val));
    return `<div class="srow${cls}" style="${cVars(e.c)}">
      <div class="rk">${started?e.rank:'–'}</div>
      <div class="info">
        <div class="nm">
          <button type="button" class="nome clickable" data-action="cwin" data-cid="${e.c.id}"><i class="cdot"></i><span class="nm-t">${esc(e.c.nome)}</span><span class="cwin-hint" title="Competizioni vinte">${ic('trophy')}${wc}<span class="wtxt"> ${plur(wc,'gara vinta','gare vinte')}</span></span></button>
          ${started && e.rank===1 ? '<span class="pill gold">In testa</span>' : ''}
        </div>
        <div class="meter"><i style="width:${pct.toFixed(1)}%"></i></div>
        ${isDr && showCoeff()?`<div class="sub">coeff. ${fmtCoeff(e.c.coeff)}</div>`:''}
      </div>
      <div class="sc"><b class="tot">${fv(e.val)}</b><span class="gap">${gap}</span></div>
    </div>`;
  }).join('');

  return `${viewHead(`Classifica <span class="g${isDr?' s':''}">${isDr?'Drappo':'Palio'}</span>`, {eyebrow: lab||'Palio Malaspina 2026', live: !!lab, right: tipoSwitch(tipo)})}
  <div class="cl-grid">${hero}${progressHTML()}<div class="standings">${rows}</div></div>

const _charts = {};   // geometria dei grafici disegnati (serve al tooltip)
function drawCharts(){
  const {disp,palio,drappo} = calcola();
  if(disp.length===0) return;
  const labels = disp.map(g=>`${g.sport}${g.categoria?(' '+g.categoria):''}`);

// colore leggibile sul fondo del tema corrente: più chiaro se scuro (tema scuro), più profondo se troppo chiaro (tema chiaro)
const isDarkTheme = () => document.documentElement.getAttribute('data-theme')==='dark';
function chartCol(hex){
  if(isDarkTheme()) return lift(hex);
  const l = lum(hex);
  return l <= .3 ? hex : mixHex(hex, '#000000', Math.min(.5, .12 + (l-.3)*.75));
}
// schiarisce i colori troppo scuri per leggerli su fondo nero
function lift(hex){
  const l = lum(hex);
  if(l >= .14) return hex;
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return hex;
  const n = parseInt(m[1],16), t = .45;
  const mix = v => Math.round(v + (255-v)*t).toString(16).padStart(2,'0');
  return '#'+mix(n>>16&255)+mix(n>>8&255)+mix(n&255);
}
function buildChart(el, series, labels, decimals, key){
  const W = Math.max(300, Math.round(el.clientWidth) || 820);
  const g = lineChartSVG(series, labels, decimals, key, W);
  _charts[key] = g.geo;
  el.innerHTML = g.svg + '<div class="tt" aria-hidden="true"></div>';
}
function lineChartSVG(series, labels, decimals, key, W){
  const small = W < 560;
  const H = small ? 300 : 380;
  const pad = {l: small?36:46, r: small?(decimals?92:84):(decimals?140:118), t:18, b:34};
  const fmt = v => decimals ? fmtD(v) : fmtP(v);
  // gradienti per contrada: i due colori si mischiano lungo la linea (coordinate assolute: reggono anche le linee piatte)
  const defs = '<defs>'+series.map(s=>
    `<linearGradient id="ln_${key}_${s.id}" gradientUnits="userSpaceOnUse" x1="${pad.l}" y1="0" x2="${W-pad.r}" y2="0">
       <stop offset="0%" stop-color="${chartCol(s.c1)}"/><stop offset="100%" stop-color="${chartCol(s.c2)}"/></linearGradient>`
  ).join('')+'</defs>';
  const n = labels.length;
  const allMax = Math.max(1, ...series.flatMap(s=>s.data));
  const step = niceStep(allMax/(small?4:5));
  const yMax = Math.ceil(allMax/step)*step || step;
  const xOf = i => pad.l + (n<=1 ? (W-pad.l-pad.r)/2 : (i/(n-1))*(W-pad.l-pad.r));
  const yOf = v => H-pad.b - (v/yMax)*(H-pad.t-pad.b);
  let s='';
  // griglia + etichette Y
  for(let v=0; v<=yMax+1e-9; v+=step){
    const y=yOf(v);
    s+=`<line class="gl" x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}"/>`;
    s+=`<text class="ax" x="${pad.l-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${Number.isInteger(step) ? fmtP(v) : fmt(v)}</text>`;
  }
  // etichette X: numero della gara, distanziate quanto basta
  const plotW = W-pad.l-pad.r;
  const everyX = Math.max(1, Math.ceil(n/Math.max(2, Math.floor(plotW/30))));
  for(let i=0;i<n;i++){
    if(i%everyX!==0 && i!==n-1) continue;
    s+=`<text class="ax" x="${xOf(i).toFixed(1)}" y="${H-pad.b+20}" text-anchor="middle">${i+1}</text>`;
  }
  // linee per contrada: alone + tratto
  series.forEach(se=>{
    const pts = se.data.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    if(n>1){
      s+=`<polyline points="${pts}" fill="none" stroke="${chartCol(se.color)}" stroke-opacity=".16" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>`;
      s+=`<polyline points="${pts}" fill="none" stroke="url(#ln_${key}_${se.id})" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    if(n<=24) se.data.forEach((v,i)=>{
      if(i===n-1) return;
      s+=`<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="2.6" fill="${chartCol(se.color)}"/>`;
    });
  });
  // etichette dirette a fine linea (distanziate per non sovrapporsi)
  const gap = 15;
  const ends = series.map(se=>({se, y0:yOf(se.data[n-1]), y:yOf(se.data[n-1])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<gap) ends[i].y = ends[i-1].y+gap;
  for(let i=ends.length-1;i>=0;i--){ const lim = i===ends.length-1 ? H-pad.b+4 : ends[i+1].y-gap; if(ends[i].y>lim) ends[i].y=lim; }
  const xe = xOf(n-1);
  ends.forEach(({se,y0,y})=>{
    const col = chartCol(se.color);
    if(Math.abs(y-y0)>1) s+=`<line x1="${(xe+5).toFixed(1)}" y1="${y0.toFixed(1)}" x2="${(xe+11).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-opacity=".6"/>`;
    s+=`<circle cx="${xe.toFixed(1)}" cy="${y0.toFixed(1)}" r="5" fill="${col}" class="pt"/>`;
    s+=`<text class="el${small?' sm':''}" x="${(xe+14).toFixed(1)}" y="${(y+4).toFixed(1)}" fill="${col}">${esc(se.nome.toUpperCase())}${small?'':`<tspan class="ev" dx="6">${fmt(se.data[n-1])}</tspan>`}</text>`;
  });
  // elementi del cursore (si muovono con il puntatore)
  s+=`<g class="cur"><line class="xh" x1="0" x2="0" y1="${pad.t}" y2="${H-pad.b}"/>`+
     series.map(se=>`<circle class="hd pt" r="5.5" cx="0" cy="0" fill="${chartCol(se.color)}"/>`).join('')+`</g>`;
  s+=`<rect class="hit" x="${pad.l}" y="${pad.t}" width="${plotW}" height="${H-pad.t-pad.b}" fill="transparent"/>`;
  return {
    svg: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Andamento dei punti dopo ogni gara">${defs}${s}</svg>`,
    geo: {W,H,pad,n,series,labels,decimals,xOf,yOf}
  };
}
function niceStep(x){
  if(x<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(x)));
  const f=x/p;
  return (f<=1?1:f<=2?2:f<=5?5:10)*p;
}
// cursore + tooltip sui grafici (mouse e touch)
function chartPointer(e){
  const host = e.target && e.target.closest ? e.target.closest('.chart') : null;
  document.querySelectorAll('.chart.hv').forEach(h=>{ if(h!==host) h.classList.remove('hv'); });
  if(!host) return;
  const C = _charts[host.dataset.key], svg = host.querySelector('svg'), tt = host.querySelector('.tt');
  if(!C || !svg || !tt) return;
  const r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) * (C.W / r.width);
  const span = C.W - C.pad.l - C.pad.r;
  let i = C.n<=1 ? 0 : Math.round((x - C.pad.l)/span*(C.n-1));
  i = Math.max(0, Math.min(C.n-1, i));
  const gx = C.xOf(i);
  const xh = svg.querySelector('.xh');
  xh.setAttribute('x1', gx); xh.setAttribute('x2', gx);
  svg.querySelectorAll('.hd').forEach((c,k)=>{ c.setAttribute('cx', gx); c.setAttribute('cy', C.yOf(C.series[k].data[i])); });
  const fmt = v => C.decimals ? fmtD(v) : fmtP(v);
  const rows = C.series.map(s=>({s, v:s.data[i]})).sort((a,b)=>b.v-a.v);
  tt.innerHTML = `<div class="tt-h"><b>${i+1}</b><span>${esc(C.labels[i])}</span></div>` +
    rows.map(({s,v})=>`<div class="tt-r" style="--cc:${chartCol(s.color)}"><i></i><span>${esc(s.nome)}</span><b>${fmt(v)}</b></div>`).join('');
  host.classList.add('hv');
  const px = gx / C.W * r.width;
  if(px > r.width*.58){ tt.style.left='auto'; tt.style.right=(r.width-px+14)+'px'; }
  else { tt.style.right='auto'; tt.style.left=(px+14)+'px'; }
}
document.addEventListener('pointermove', chartPointer);
document.addEventListener('pointerdown', chartPointer);

function renderPresent(){
  const tipo = presentMode;

  document.getElementById('presTitle').innerHTML = `Classifica <span class="g${isDr?' s':''}">${isDr?'Drappo':'Palio'}</span>`;

  // podio (primi 3 per posizione), disposto 2 - 1 - 3
  const top3 = arr.filter(e=>e.rank<=3);
  const byRank = r => top3.filter(e=>e.rank===r);
  const hMap = {1:30, 2:22, 3:16};   // altezza dei gradini in vh
  const podBlock = e => {
    const k = inkSpan(e.c.c1, e.c.c2, 0, .4);

  };
  const ord = [].concat(byRank(2), byRank(1), byRank(3));

  const big = `<div class="bigstand">${arr.map(e=>`

  document.getElementById('presBody').innerHTML =
    `<div class="pr-grid${started?'':' solo'}">${podium}${big}</div><div class="pr-foot">${progressHTML()}</div>`;
}

function download(filename, text, mime){
  const blob = new Blob([text], {type:mime||'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function exportCSV(){
  const {totP,totD,disp} = calcola();
  const C = state.contrade;
  const SEP=';';
  const dec = n => String(n).replace('.',',');
  const lines = [];
  lines.push('PALIO 2026 - CALCOLO PUNTEGGIO');
  lines.push('');
  // classifica palio
  lines.push('CLASSIFICA PALIO');
  lines.push(['Pos','Contrada','Punti'].join(SEP));
  classifica('palio').forEach(e=>lines.push([e.rank, e.c.nome, fmtP(e.val)].join(SEP)));
  lines.push('');
  lines.push('CLASSIFICA DRAPPO');
  lines.push(['Pos','Contrada','Coeff','Punti'].join(SEP));
  classifica('drappo').forEach(e=>lines.push([e.rank, e.c.nome, dec(fmtCoeff(e.c.coeff)), dec(fmtD(e.val))].join(SEP)));
  lines.push('');
  // dettaglio punti palio per gara
  lines.push('PUNTI PALIO PER GARA');
  lines.push(['#','Sport','Categoria','Tipo', ...C.map(c=>c.nome)].join(SEP));
  state.gare.forEach((g,i)=>{
    const cells = C.map(c=> g.pos[c.id]==null ? '' : fmtP(puntiPalio(g,c.id)));
    lines.push([i+1, g.sport, g.categoria, g.tipo, ...cells].join(SEP));
  });
  lines.push(['','','','TOTALE', ...C.map(c=>fmtP(totP[c.id]))].join(SEP));
  lines.push('');
  // dettaglio punti drappo per gara
  lines.push('PUNTI DRAPPO PER GARA');
  lines.push(['#','Sport','Categoria','Tipo', ...C.map(c=>c.nome)].join(SEP));
  state.gare.forEach((g,i)=>{
    const cells = C.map(c=> g.pos[c.id]==null ? '' : dec(fmtD(puntiDrappo(g,c.id))));
    lines.push([i+1, g.sport, g.categoria, g.tipo, ...cells].join(SEP));
  });
  lines.push(['','','','TOTALE', ...C.map(c=>dec(fmtD(totD[c.id])))].join(SEP));
  const BOM='﻿';
  download('Palio2026_punteggio.csv', BOM+lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function importJSON(){
  document.getElementById('importFile').click();
}
function handleImport(file){
  const r = new FileReader();
  r.onload = e => {
    try{
      const s = migrate(JSON.parse(e.target.result));
      if(!s) throw new Error('formato non valido');
      state = s; save(); render();
      toast('Dati importati correttamente');
    }catch(err){
      toast('File non valido: '+err.message, 'err');
    }
  };
  r.readAsText(file);
}

/* ===================== EVENTI ===================== */
function findGara(gid){ return state.gare.find(g=>g.id===gid); }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;
  if(['reset-all','gara-add','gara-del','gara-up','gara-down','import-json','pub-reveal','pub-hide','demo-fill','ann-publish','ann-clear'].includes(a) && !canEdit()) return;
  switch(a){
    case 'nav':
      if(t.dataset.view==='present'){ openPresent(); return; }
      if(t.dataset.view==='contrade') contradaSel = null;       // toccando la scheda si torna all'elenco
      current = t.dataset.view; render(); window.scrollTo({top:0});
      break;
    case 'team':
      closeCwin();
      contradaSel = t.dataset.cid; current = 'contrade'; render(); window.scrollTo({top:0});
      break;
    case 'team-back':
      contradaSel = null; render(); window.scrollTo({top:0});
      break;
    case 'present-close': closePresent(); break;
    case 'present-mode': presentMode = t.dataset.mode; renderPresent(); break;
    case 'donate-open': openDonate(); break;
    case 'donate-close': closeDonate(); break;
    case 'cwin': openCwin(t.dataset.cid); break;
    case 'cwin-close': closeCwin(); break;
    case 'copy-iban':
      copyText(DON_IBAN).then(()=>{
        t.innerHTML = ic('check')+' IBAN copiato!';
      }).catch(()=>{
        t.innerHTML = ic('alert')+' Copia manualmente l\'IBAN qui sopra';
        const el=document.querySelector('.iban');
        if(el && window.getSelection){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
      }).finally(()=>{ setTimeout(()=>{ t.innerHTML = ic('copy')+' Copia IBAN'; }, 2200); });
      break;
    case 'pub-reveal': {
      const pin = prompt('Inserisci il PIN per PUBBLICARE le classifiche al pubblico:');
      if(pin==null) break;
      if(pin.trim() !== REVEAL_PIN){ alert('PIN errato. Pubblicazione annullata.'); break; }
      publishReveal();
      toast('Classifiche pubblicate al pubblico');
      break;
    }
    case 'pub-hide':
      if(confirm('Nascondere le classifiche al pubblico?\n\nTornerà a vedere il messaggio di attesa.')) publishHide();
      break;
    case 'ann-publish': {
      const sel = document.querySelector('select[data-action="ann-tipo"]');
      const choice = sel ? sel.value : 'palio';
      if(!state.gare.some(disputata)){ alert('Nessuna gara disputata: non c\'è ancora un vincitore da annunciare.'); break; }
      const types = choice==='entrambi' ? ['palio','drappo'] : [choice];
      const updates = { active:null, items:null };          // ripulisce eventuale formato vecchio
      const desc = [];
      types.forEach(t=>{
        const winners = classifica(t).filter(e=>e.rank===1).map(e=>({nome:e.c.nome, c1:e.c.c1, c2:e.c.c2}));
        updates[t] = { winners, at:firebase.database.ServerValue.TIMESTAMP };
        desc.push((t==='drappo'?'Drappo: ':'Palio: ')+winners.map(w=>w.nome).join(' e '));
      });
      if(confirm(`Annunciare al pubblico — ${desc.join(' · ')}?\n\nApparirà un banner di festeggiamento sulla home del sito.`)){
        db.ref(CLOUD_PATH+'/public/announce').update(updates).catch(e=>console.warn('ann err', e));
      }
      break; }
    case 'ann-clear': {
      const sel = document.querySelector('select[data-action="ann-tipo"]');
      const choice = sel ? sel.value : 'palio';
      const types = choice==='entrambi' ? ['palio','drappo'] : [choice];
      const lab = types.map(t=>t==='drappo'?'Drappo':'Palio').join(' e ');
      if(confirm(`Rimuovere l'annuncio (${lab}) dal sito pubblico?`)){
        const updates = {active:null, items:null};
        types.forEach(t=> updates[t]=null);
        db.ref(CLOUD_PATH+'/public/announce').update(updates).catch(e=>console.warn('ann clear err', e));
      }
      break; }
    case 'demo-fill': {
      const pin = prompt('MODALITÀ DEMO — riempie TUTTE le gare con punteggi casuali (sovrascrive i risultati attuali).\n\nInserisci il PIN per continuare:');
      if(pin==null) break;
      if(pin.trim() !== REVEAL_PIN){ alert('PIN errato. Operazione annullata.'); break; }
      demoFill();
      break;
    }
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-json': importJSON(); break;
    case 'reset-all': {
      const pin = prompt('RIPRISTINO — cancella TUTTI i risultati inseriti e ripristina contrade, tabella punti ed elenco gare.\n\nInserisci il PIN per continuare:');
      if(pin==null) break;
      if(pin.trim() !== REVEAL_PIN){ alert('PIN errato. Ripristino annullato.'); break; }
      state = defaults(); save(); render();
      break;
    }
    case 'gara-add':
      state.gare.push({id:uid(), sport:'Nuova gara', categoria:'', tipo:'Punti 4', pos:emptyPos()});
      save(); render();
      break;
    case 'gara-del': {
      const g = findGara(t.dataset.gid);
      if(g && confirm('Eliminare la gara "'+g.sport+(g.categoria?' '+g.categoria:'')+'"?')){
        state.gare = state.gare.filter(x=>x.id!==t.dataset.gid); save(); render();
      }
      break; }
    case 'gara-up': moveGara(t.dataset.gid,-1); break;
    case 'gara-down': moveGara(t.dataset.gid,1); break;
  }
});
function moveGara(gid, dir){
  const i = state.gare.findIndex(g=>g.id===gid);
  const j = i+dir;
  if(i<0||j<0||j>=state.gare.length) return;
  const arr=state.gare; [arr[i],arr[j]]=[arr[j],arr[i]];
  save(); render();
}

document.addEventListener('change', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;
  if(['pos','tipo','cfg-cont','cfg-punti','cfg-gara','pub-label','pub-message'].includes(a) && !canEdit()){ render(); return; }
  if(a==='pub-label'){ publishField('label', t.value); return; }
  if(a==='pub-message'){ publishField('message', t.value); return; }
  if(a==='pos'){
    const g = findGara(t.dataset.gid);
    g.pos[t.dataset.cid] = t.value==='' ? null : parseInt(t.value,10);
    save(); render();
  }
  else if(a==='tipo'){
    findGara(t.dataset.gid).tipo = t.value; save(); render();
  }
  else if(a==='cfg-cont'){
    const c = contrada(t.dataset.cid), f=t.dataset.f;
    if(f==='coeff'){ const v=parseFloat(String(t.value).replace(',','.')); if(!isNaN(v)) c.coeff=v; }
    else c[f]=t.value;
    save();
    if(f==='coeff') render(); // i valori dipendono dal coeff
  }
  else if(a==='cfg-punti'){
    const v = parseFloat(String(t.value).replace(',','.'));
    state.tabellaPunti[t.dataset.tipo][parseInt(t.dataset.idx,10)] = isNaN(v)?0:v;
    save();
  }
  else if(a==='cfg-gara'){
    const g = findGara(t.dataset.gid);
    g[t.dataset.f] = t.value;
    save();
    if(t.dataset.f==='tipo') { /* niente re-render: select già aggiornato */ }
  }
  else if(t.id==='importFile'){ /* gestito sotto */ }
});

document.getElementById('importFile').addEventListener('change', function(){
  if(this.files && this.files[0]) handleImport(this.files[0]);
  this.value='';
});

// scorciatoie presentazione
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closePresent(); closeDonate(); closeCwin(); }
  // i riquadri cliccabili (div role="button") rispondono anche a Invio e Spazio
  if((e.key==='Enter' || e.key===' ') && e.target && e.target.matches && e.target.matches('[role="button"][data-action]')){
    e.preventDefault(); e.target.click();
  }
});
// click sullo sfondo scuro chiude le finestre
document.getElementById('donate').addEventListener('click', function(e){ if(e.target===this) closeDonate(); });
document.getElementById('cwin').addEventListener('click', function(e){ if(e.target===this) closeCwin(); });

// ri-render al passaggio mobile<->desktop (la vista Gare cambia layout)
let _wasMobile = isMobile(), _resizeT = null;
window.addEventListener('resize', ()=>{
  clearTimeout(_resizeT);
  _resizeT = setTimeout(()=>{
    if(isMobile()!==_wasMobile){ _wasMobile=isMobile(); render(); }
    else if(current==='grafici' && document.getElementById('chartPalio')) drawCharts();   // i grafici seguono la larghezza
  }, 200);
});

/* ===================== AUTOTEST (console) ===================== */
function selfTest(){
  // scenario noto: tutte le contrade 5ª con tipo Punti B -> 1 punto Palio ciascuna, Drappo = coeff
  const bak = JSON.stringify(state);
  state = defaults();
  const g = state.gare.find(x=>x.tipo==='Punti B') || state.gare[0];
  g.tipo='Punti B';
  state.contrade.forEach(c=> g.pos[c.id]=5);
  const okPalio = state.contrade.every(c=> puntiPalio(g,c.id)===1);
  const okDr = Math.abs(puntiDrappo(g,'sagittario') - 2) < 1e-9
            && Math.abs(puntiDrappo(g,'andromeda') - 3.33) < 1e-9;
  // 1ª posto Punti 5 = 10
  g.tipo='Punti 5'; g.pos.bosco=1;
  const okP5 = puntiPalio(g,'bosco')===10;
  state = JSON.parse(bak);
  console.log('%cAutotest calcolo:', 'color:#d4af37',
    okPalio&&okDr&&okP5 ? 'OK ✓' : 'FALLITO ✗', {okPalio, okDr, okP5});
}

/* ===================== TEMA CHIARO / SCURO ===================== */
const THEME_KEY = 'palioTheme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t==='dark' ? '#0d1015' : '#f7f8fa');
  const b = document.getElementById('themeBtn');
  if(b){
    const lab = t==='dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro';
    b.innerHTML = ic(t==='dark' ? 'sun' : 'moon'); b.title = lab; b.setAttribute('aria-label', lab);
  }
  if(document.getElementById('chartPalio')) drawCharts();   // i colori dei grafici dipendono dal tema
}

/* ===================== AVVIO ===================== */
isAdmin = false;                          // verrà impostato dal login Firebase (onAuthStateChanged)
state = load() || defaults();
initCloud();                              // attiva il cloud (cloudOn sincrono) prima del primo render
render();
updateTopbar();
if(!storageOk) badge('warn'); else badge(cloudOn && !isAdmin ? 'view' : 'ok');
document.getElementById('adminBtn').addEventListener('click', promptAdmin);
applyTheme(isDarkTheme() ? 'dark' : 'light');
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const t = isDarkTheme() ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  applyTheme(t);
});
if(window.matchMedia){
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onSys = e=>{ let sv = null; try{ sv = localStorage.getItem(THEME_KEY); }catch(_){} if(sv!=='light' && sv!=='dark') applyTheme(e.matches?'dark':'light'); };
  if(mq.addEventListener) mq.addEventListener('change', onSys);
}
try{ selfTest(); }catch(e){ console.warn('selfTest error', e); }

})();
