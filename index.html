<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Classifica Palio e Drappo del Palio Malaspina 2026.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304060b'/%3E%3Cg stroke-width='7' stroke-linecap='round' fill='none'%3E%3Cpath d='M11 50 20 14' stroke='%2322c55e'/%3E%3Cpath d='M20 50 29 14' stroke='%2338bdf8'/%3E%3Cpath d='M29 50 38 14' stroke='%23cbd5e1'/%3E%3Cpath d='M38 50 47 14' stroke='%23f97316'/%3E%3Cpath d='M47 50 56 14' stroke='%233a5fe0'/%3E%3C/g%3E%3C/svg%3E">
<title>Palio 2026 – Calcolo Punteggio</title>
<script>
/* tema chiaro/scuro: scelta salvata, altrimenti quella del dispositivo (impostato subito per evitare lampi) */
(function(){var t=null;try{t=localStorage.getItem('palioTheme');}catch(e){}
if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* =====================================================================
     PALIO 2026 — "Minimal chiaro" (proposta D) con tema chiaro e scuro
     Pulito e calmo: i dati sono i protagonisti, il colore delle contrade
     compare solo in pallini, barre ed etichette.
     Oro = Palio, argento = Drappo.
     Tema: attributo data-theme="light|dark" su <html> (scelto all'avvio nello <script> in testa).
     ===================================================================== */
  :root{
    color-scheme:light;
    --bg:#f7f8fa; --card:#ffffff; --card-2:#f3f4f7; --chip-bg:#edeff3;
    --line:#e6e9ef; --line-2:#d5dae3;
    --text:#14181f; --text-2:#5b6472; --text-3:#7b8494;
    --inv-bg:#14181f; --inv-fg:#ffffff;
    --gold:#c9961a; --gold-ink:#8a6510; --gold-bg:#fbf3dc; --gold-line:#ebd59a;
    --silver:#8e99ab; --silver-ink:#586274; --silver-bg:#eef0f4; --silver-line:#d7dce5;
    --bronze:#b86a2c; --bronze-bg:#f6e4d4;
    --live:#22c55e; --live-ink:#15803d; --live-bg:#e8f7ee; --live-line:#b7e4c8;
    --warn:#b45309; --warn-bg:#fdf1de; --warn-line:#efc98f;
    --danger:#dc2626;
    --shadow:0 1px 2px rgba(20,24,31,.04), 0 10px 28px -16px rgba(20,24,31,.16);
    --overlay:rgba(20,24,31,.42);
    --tick-off:#e3e6ec;
    --display:"Inter","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --body:var(--display);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r:16px; --r-s:10px;
    /* nomi storici, rimandati ai nuovi */
    --ink-0:var(--bg); --ink-1:var(--bg); --ink-2:var(--card); --ink-3:var(--card-2); --ink-4:var(--line);
    --gold-2:var(--gold-ink); --silver-2:var(--silver-ink);
    --bg-1:var(--ink-1); --bg-2:var(--ink-2); --bg-3:var(--ink-3); --bg-4:var(--ink-4);
    --border:var(--line-2); --text-dim:var(--text-2); --accent:var(--gold); --accent-2:var(--gold-2); --success:var(--live);
    /* colori ufficiali contrade (riusati dalla companion app) */
    --andromeda:#9ca3af; --bosco:#f97316; --giardini:#16a34a; --lago:#1e40af; --sagittario:#ec4899;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0d1015; --card:#161a21; --card-2:#1d222b; --chip-bg:#222833;
    --line:#272d38; --line-2:#363d4b;
    --text:#f2f4f8; --text-2:#a7b0bf; --text-3:#7c8696;
    --inv-bg:#f2f4f8; --inv-fg:#0d1015;
    --gold:#e3b23c; --gold-ink:#efc766; --gold-bg:rgba(227,178,60,.13); --gold-line:rgba(227,178,60,.38);
    --silver:#98a4b8; --silver-ink:#bcc5d4; --silver-bg:rgba(152,164,184,.13); --silver-line:rgba(152,164,184,.34);
    --bronze:#e0924f; --bronze-bg:rgba(224,146,79,.15);
    --live:#34d57d; --live-ink:#5fe39a; --live-bg:rgba(52,213,125,.11); --live-line:rgba(52,213,125,.4);
    --warn:#f5b04a; --warn-bg:rgba(245,176,74,.1); --warn-line:rgba(245,176,74,.4);
    --danger:#f87171;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -18px rgba(0,0,0,.7);
    --overlay:rgba(0,0,0,.66);
    --tick-off:#2a303b;
  }
  *{box-sizing:border-box}
  html{background:var(--bg); -webkit-text-size-adjust:100%}
  body{
    margin:0; position:relative; min-height:100vh; overflow-x:hidden;
    background:var(--bg); color:var(--text); font-family:var(--body); font-size:.95rem; line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  h1,h2,h3,p{margin:0}
  a{color:var(--gold-ink)}
  ::selection{background:var(--gold); color:#000}
  *{scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
  :focus-visible{outline:2px solid var(--text); outline-offset:2px}
  button{font-family:inherit}
  .ic{width:1.15em; height:1.15em; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  .muted{color:var(--text-2)}
  .skip{position:absolute; left:-9999px; top:8px; z-index:300; background:var(--inv-bg); color:var(--inv-fg); padding:8px 14px; font-weight:600; border-radius:8px}
  .skip:focus{left:8px}
  /* pallino con i due colori della contrada */
  .cdot{display:inline-block; flex:none; width:.7em; height:.7em; border-radius:50%; background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%); box-shadow:inset 0 0 0 1px rgba(128,128,128,.28)}

  /* ---------- barra in alto ---------- */
  #top{position:sticky; top:0; z-index:50; border-bottom:1px solid var(--line)}
  #top::before{
    content:""; position:absolute; inset:0; z-index:-1; background:color-mix(in srgb,var(--card) 90%,transparent);
    -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
  }
  .top-in{
    max-width:1280px; margin:0 auto; padding:12px max(24px,env(safe-area-inset-right)) 12px max(24px,env(safe-area-inset-left));
    display:grid; align-items:center; gap:20px;
    grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"brand nav bar";
  }
  .brand{grid-area:brand; display:flex; align-items:center; gap:11px; min-width:0}
  .stripes{display:inline-flex; gap:3px; height:22px; align-items:stretch; transform:skewX(-20deg); flex:none}
  .stripes i{width:4px; border-radius:2px}
  .stripes i:nth-child(1){background:#22c55e} .stripes i:nth-child(2){background:#38bdf8}
  .stripes i:nth-child(3){background:#cbd5e1} .stripes i:nth-child(4){background:#f97316}
  .stripes i:nth-child(5){background:#3a5fe0}
  .brand-t{display:flex; align-items:baseline; gap:6px; line-height:1; letter-spacing:-.01em}
  .brand-t b{font-size:1.12rem; font-weight:600}
  .brand-t em{font-size:1.12rem; font-weight:400; font-style:normal; color:var(--text-3)}
  .brand-s{display:none}
  .top-rule{display:none}
  #topbar{grid-area:bar; display:flex; gap:8px; align-items:center; justify-content:flex-end}
  #saveBadge{font:500 .72rem var(--body); color:var(--text-3); transition:color .3s}
  #saveBadge.ok{color:var(--live-ink)}
  #saveBadge.warn{color:var(--warn)}
  .cbadge{
    display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px;
    font:500 .78rem/1 var(--body); white-space:nowrap;
    border:1px solid var(--line); color:var(--text-2); background:var(--card);
  }
  .cbadge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
  .cbadge.live{color:var(--text-2)}
  .cbadge.live::before{background:var(--live); animation:pulse 1.8s infinite}
  .cbadge.off{color:var(--warn); border-color:var(--warn-line); background:var(--warn-bg)}
  .cbadge.btnlike{cursor:pointer; border-radius:10px; color:var(--text)}
  .cbadge.btnlike::before{display:none}
  .cbadge.btnlike .ic{width:14px; height:14px}
  .cbadge.btnlike:hover{border-color:var(--line-2); background:var(--card-2)}
  .cbadge.btnlike.admin{background:var(--inv-bg); color:var(--inv-fg); border-color:var(--inv-bg)}
  #themeBtn{padding:7px 9px}
  #themeBtn .ic{width:16px; height:16px}

  /* ---------- schede di navigazione ---------- */
  #nav{grid-area:nav; display:flex; gap:6px; justify-content:center; min-width:0; padding:2px 4px; overflow-x:auto; scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  .tab{appearance:none; -webkit-appearance:none; border:0; margin:0; padding:0; background:var(--chip-bg); color:var(--text-2); cursor:pointer; border-radius:999px; transition:background .15s,color .15s}
  .tab-in{display:flex; align-items:center; gap:8px; padding:9px 16px; white-space:nowrap; font:500 .88rem/1 var(--body)}
  .tab .ic{width:16px; height:16px}
  .tab:hover{background:var(--line); color:var(--text)}
  .tab.on{background:var(--inv-bg); color:var(--inv-fg)}
  .tab .ns{display:none}
  /* con molte schede (admin) o poco spazio: la barra va su una seconda riga */
  #top.many .top-in{grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"brand bar" "nav nav"; gap:8px 16px}
  #top.many #nav{justify-content:flex-start; padding-bottom:2px}
  @media (max-width:1079px){
    .top-in{grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"brand bar" "nav nav"; gap:8px 16px}
    #nav{justify-content:flex-start; padding-bottom:2px}
  }

  /* ---------- contenuto ---------- */
  main{max-width:1200px; margin:0 auto; padding:32px max(24px,env(safe-area-inset-right)) 72px max(24px,env(safe-area-inset-left))}
  .vhead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; margin:0 0 22px}
  .eyebrow{display:flex; align-items:center; gap:8px; margin-bottom:8px; font:400 .88rem/1.3 var(--body); color:var(--text-2)}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.8s infinite}
  .vtitle{font:500 clamp(1.7rem,3.4vw,2.5rem)/1.08 var(--display); letter-spacing:-.025em}
  .vtitle .g,.vtitle .g.s{color:inherit}
  .lead{max-width:62ch; margin:0 0 22px; color:var(--text-2)}
  .hint{font-size:.8rem; line-height:1.55; color:var(--text-3); margin:12px 2px 0}
  .hint.pad{padding:0 18px 16px}
  .hint b{color:var(--text-2); font-weight:600}
  .hint .ic{width:13px; height:13px; vertical-align:-2px; margin:0 2px 0 4px}

  /* selettore a due posizioni */
  .seg{display:inline-flex; gap:2px; padding:4px; border-radius:14px; background:var(--chip-bg)}
  .seg-b{appearance:none; -webkit-appearance:none; border:0; background:transparent; color:var(--text-2); cursor:pointer; display:inline-flex; align-items:center; gap:9px; padding:9px 22px; border-radius:10px; font:500 .86rem/1 var(--body)}
  .seg-b .ic{display:none}
  .seg-b::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--gold)}
  .seg-b[data-view="drappo"]::before,.seg-b[data-mode="drappo"]::before{background:var(--silver)}
  .seg-b:hover{color:var(--text)}
  .seg-b.on{background:var(--card); color:var(--text); font-weight:600; box-shadow:0 1px 2px rgba(20,24,31,.1), 0 2px 8px -2px rgba(20,24,31,.1)}
  :root[data-theme="dark"] .seg-b.on{background:var(--line-2)}

  /* avanzamento: una tacca per gara */
  .prog{padding:20px 24px 22px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
  .prog-k{margin-bottom:10px; font:500 .68rem/1 var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--text-3)}
  .prog-l{display:flex; align-items:baseline; gap:7px; margin-bottom:14px; font:400 .86rem var(--body); color:var(--text-2)}
  .prog-l b{font:300 2.1rem/1 var(--display); letter-spacing:-.03em; color:var(--text)}
  .prog-l .of{font:300 2.1rem/1 var(--display); letter-spacing:-.03em; color:var(--text-3)}
  .ticks{display:flex; gap:3px; height:20px}
  .ticks i{flex:1; background:var(--tick-off); border-radius:2px}
  .ticks i.on{background:var(--text)}

  /* ---------- classifica: griglia, "in testa" e righe ---------- */
  .cl-grid{display:grid; gap:16px 24px; align-items:start; grid-template-columns:minmax(0,1fr) 360px; grid-template-rows:auto auto 1fr; grid-template-areas:"main hero" "main prog" "main ."}
  .cl-grid > .hero{grid-area:hero}
  .cl-grid > .prog{grid-area:prog}
  .cl-grid > .standings{grid-area:main}
  .hero{
    position:relative; overflow:hidden; padding:30px 28px 24px; border-radius:var(--r);
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  .hero::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--hs,var(--line-2))}
  .hero-k{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; font:500 .68rem/1 var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--text-3)}
  .hero-score{display:flex; align-items:baseline; gap:10px; margin:6px 0 14px}
  .hero-score b{font:300 clamp(3.2rem,6vw,4.2rem)/1 var(--display); letter-spacing:-.04em; font-variant-numeric:tabular-nums}
  .hero-score span{font:400 .95rem var(--body); color:var(--text-3)}
  .hero-name{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; font:600 1.35rem/1.2 var(--display); letter-spacing:-.015em; overflow-wrap:anywhere}
  .hero-name .cdot{width:.62em; height:.62em}
  .hero-name .amp{color:var(--text-3); font-weight:400}
  .hero-name.multi{font-size:1.15rem}
  .hero-meta{display:flex; justify-content:space-between; gap:12px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); font-size:.88rem; color:var(--text-2)}
  .hero-meta:empty{display:none}
  .hero-meta b{font-weight:600; color:var(--text)}
  .hero.idle .hero-name{font-size:1.15rem}
  .hero.idle .hero-meta{border-top:0; padding-top:0; margin-top:10px}
  .standings{overflow:hidden; border-radius:var(--r); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
  .srow{
    position:relative; display:grid; grid-template-columns:34px minmax(0,1fr) auto; align-items:center; gap:0 14px;
    padding:22px 28px 22px 28px; border-bottom:1px solid var(--line);
  }
  .srow:last-child{border-bottom:0}
  .rk{font:400 .95rem/1 var(--body); font-variant-numeric:tabular-nums; color:var(--text-3)}
  .srow.p1 .rk{color:var(--text); font-weight:600}
  .info{min-width:0}
  .nm{display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px}
  .nome{
    appearance:none; -webkit-appearance:none; background:none; border:0; padding:0; margin:0; cursor:pointer; color:var(--text); text-align:left;
    display:inline-flex; align-items:center; gap:10px; flex-wrap:wrap;
    font:500 1.3rem/1.15 var(--display); letter-spacing:-.015em;
  }
  .nome .cdot{width:.56em; height:.56em}
  .nome:hover .nm-t{text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:4px}
  .cwin-hint{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font:500 .76rem/1 var(--body); color:var(--text-2); border:1px solid var(--line); background:var(--card-2); white-space:nowrap}
  .cwin-hint .ic{width:13px; height:13px; color:var(--gold)}
  .ldr{display:inline-flex; align-items:center; gap:10px}
  .nome:hover .cwin-hint{border-color:var(--line-2)}
  .meter{height:4px; margin-top:14px; background:var(--tick-off); border-radius:2px; overflow:hidden}
  .meter i{display:block; height:100%; border-radius:2px; background:var(--c1); transform-origin:left; animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  :root[data-theme="dark"] .meter i{background:var(--cl,var(--c1))}
  .srow .sub{margin-top:8px; font:500 .72rem var(--body); color:var(--text-3)}
  .sc{text-align:right}
  .tot{display:block; font:300 2.2rem/1 var(--display); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .gap{display:block; margin-top:8px; font:400 .82rem/1 var(--body); color:var(--text-3); font-variant-numeric:tabular-nums}

  /* ---------- schede, titoli di sezione, etichette ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:24px; margin-bottom:16px; box-shadow:var(--shadow)}
  .card.flush{padding:0; overflow:hidden}
  .sectionTitle{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px}
  .sectionTitle h2{font:600 1.15rem/1.2 var(--display); letter-spacing:-.015em}
  .st-ic{display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--gold-bg); color:var(--gold-ink)}
  .st-ic .ic{width:16px; height:16px}
  .hall-d .st-ic{background:var(--silver-bg); color:var(--silver-ink)}
  .pill{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font:500 .74rem/1 var(--body); border:1px solid var(--line); color:var(--text-2); background:var(--card-2); white-space:nowrap}
  .pill .ic{width:12px; height:12px}
  .pill.ok{color:var(--live-ink); border-color:var(--live-line); background:var(--live-bg)}
  .pill.warn{color:var(--warn); border-color:var(--warn-line); background:var(--warn-bg)}
  .pill.gold{color:var(--gold-ink); border-color:var(--gold-line); background:var(--gold-bg)}
  .pill.silver{color:var(--silver-ink); border-color:var(--silver-line); background:var(--silver-bg)}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:16px; margin-bottom:16px}
  .grid2 > .card{margin-bottom:0}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .banner,.viewer-note{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; margin-bottom:16px;
    border-radius:12px; border:1px solid var(--warn-line); background:var(--warn-bg); color:var(--text); font-size:.86rem;
  }
  .banner > span,.viewer-note > span{flex:1 1 220px}
  .banner .ic{color:var(--warn)}
  .viewer-note{border-color:var(--live-line); background:var(--live-bg)}
  .viewer-note .ic{color:var(--live-ink)}

  /* ---------- pulsanti e moduli ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:12px; cursor:pointer;
    font:500 .86rem/1.1 var(--body); text-decoration:none;
    color:var(--text); background:var(--card); border:1px solid var(--line-2); transition:border-color .15s,background .15s,transform .15s;
  }
  .btn:hover{background:var(--card-2); border-color:var(--text-3)}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--inv-bg); color:var(--inv-fg); border-color:var(--inv-bg); font-weight:600}
  .btn.gold:hover{opacity:.88; background:var(--inv-bg)}
  .btn.danger{background:var(--danger); border-color:var(--danger); color:#fff}
  .btn.danger:hover{opacity:.88; background:var(--danger)}
  .btn.sm{padding:8px 12px; font-size:.8rem; border-radius:10px}
  .btn.block{display:flex; width:100%}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  input:not([type=color]):not([type=file]), select, textarea{
    font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line-2); border-radius:10px; padding:9px 11px;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--text); outline-offset:0; border-color:var(--text)}
  input:disabled, select:disabled, textarea:disabled{opacity:.5; cursor:not-allowed}
  select{cursor:pointer}
  select option{background:var(--card); color:var(--text)}
  .fld{display:block; margin-top:12px}
  .fld > span{display:block; margin-bottom:5px; font-size:.8rem; color:var(--text-2)}
  .w-max{width:100%; max-width:580px}
  select.tipo{padding:7px 9px; font-size:.8rem}
  select.tipo.wide{min-width:260px; max-width:100%}

  /* ---------- schermata d'attesa ---------- */
  .wait{text-align:center; padding:56px 22px 52px; margin-bottom:16px; border-radius:var(--r); border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow)}
  .wait-art{width:60px; height:60px; margin:0 auto 20px; display:grid; place-items:center; border-radius:50%; color:var(--gold-ink); background:var(--gold-bg); border:1px solid var(--gold-line)}
  .wait-art .ic{width:26px; height:26px; stroke-width:1.5; animation:flip 4s ease-in-out infinite}
  .wait .eyebrow{justify-content:center}
  .wait-msg{max-width:720px; margin:8px auto 12px; font:500 clamp(1.5rem,3.4vw,2.1rem)/1.2 var(--display); letter-spacing:-.025em}
  .wait-sub{max-width:480px; margin:0 auto; color:var(--text-2); font-size:.92rem}
  .loading{text-align:center; padding:84px 20px; color:var(--text-3); font:500 .8rem var(--body)}
  .loader{display:inline-flex; gap:5px; height:36px; align-items:flex-end; transform:skewX(-14deg); margin-bottom:14px}
  .loader i{width:6px; height:100%; border-radius:2px; transform-origin:bottom; animation:bars 1.1s ease-in-out infinite}
  .loader i:nth-child(1){background:#22c55e} .loader i:nth-child(2){background:#38bdf8; animation-delay:.12s}
  .loader i:nth-child(3){background:#cbd5e1; animation-delay:.24s} .loader i:nth-child(4){background:#f97316; animation-delay:.36s}
  .loader i:nth-child(5){background:#3a5fe0; animation-delay:.48s}

  /* ---------- invito a donare ---------- */
  .support-banner{
    display:flex; align-items:center; gap:16px; padding:20px 24px; margin-bottom:16px; border-radius:var(--r); cursor:pointer;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); transition:border-color .15s;
  }
  .support-banner:hover{border-color:var(--line-2)}
  .sb-ic{flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:50%; background:var(--card-2); color:var(--text-2)}
  .sb-ic .ic{width:19px; height:19px}
  .sb-tx{flex:1 1 auto; font-size:.9rem; line-height:1.5; color:var(--text-2)}
  .sb-tx b{font-weight:600; color:var(--text)}
  .sb-tx .sb-t{display:block; font-weight:600; color:var(--text)}
  .sb-cta{flex:none; display:inline-flex; align-items:center; gap:8px; padding:11px 22px; border-radius:12px; background:var(--inv-bg); color:var(--inv-fg); font:600 .86rem/1 var(--body); white-space:nowrap}
  .support-banner.compact{margin:24px 0 0}
  .support-banner.compact .sb-tx{font-size:.84rem}
  .support-banner.compact .sb-cta .ic{display:none}

  /* ---------- annuncio del vincitore (solo in home) ---------- */
  .announce{
    position:relative; overflow:hidden; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
    margin-bottom:28px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .a-block{position:relative; z-index:1; display:flex; align-items:center; gap:16px; padding:22px 28px}
  .a-block + .a-block{border-left:1px solid var(--line)}
  .a-ic{flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:50%; background:var(--gold-bg); color:var(--gold-ink); border:1px solid var(--gold-line)}
  .a-block.d .a-ic{background:var(--silver-bg); color:var(--silver-ink); border-color:var(--silver-line)}
  .a-ic .ic{width:20px; height:20px}
  .a-k{font:500 .68rem/1 var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--gold-ink)}
  .a-block.d .a-k{color:var(--silver-ink)}
  .a-win{display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; margin-top:8px; font:600 clamp(1.25rem,2.4vw,1.6rem)/1.15 var(--display); letter-spacing:-.02em}
  .a-name{display:inline-flex; align-items:center; gap:9px}
  .a-name .cdot{width:.56em; height:.56em}
  .a-and{font-size:.7em; font-weight:400; color:var(--text-3)}
  .a-bang{margin-left:-.45em}
  .confetti{position:absolute; top:-20px; width:6px; height:11px; border-radius:2px; opacity:.4; pointer-events:none; animation:confFall linear infinite}

  /* ---------- finestre (donazioni, gare vinte) ---------- */
  #donate,#cwin{
    position:fixed; inset:0; z-index:120; display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:6vh 16px;
    background:var(--overlay); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #donate.on,#cwin.on{display:flex}
  .don-box,.cwin-box{position:relative; width:100%; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 34px 90px -24px rgba(0,0,0,.45)}
  .don-box{max-width:760px; padding:28px}
  .cwin-box{max-width:440px; padding:0 0 20px; overflow:hidden}
  .don-close,.cwin-close{position:absolute; top:12px; right:12px; z-index:2; width:36px; height:36px; padding:0}
  .don-top{display:flex; align-items:center; gap:12px; padding-right:44px}
  .don-ic{display:grid; place-items:center; width:40px; height:40px; border-radius:50%; background:var(--card-2); color:var(--text-2)}
  .don-ic .ic{width:19px; height:19px}
  .don-box h2{font:500 clamp(1.3rem,3.4vw,1.6rem)/1.1 var(--display); letter-spacing:-.02em}
  .don-lead{margin-top:10px; color:var(--text-2); font-size:.9rem}
  .don-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr)); gap:12px; margin-top:18px}
  .don-card{padding:18px; border-radius:14px; background:var(--card-2); border:1px solid var(--line)}
  .don-card h3{display:flex; align-items:center; gap:9px; margin-bottom:10px; font:600 1rem/1.1 var(--display)}
  .don-card h3 .ic{color:var(--text-2)}
  .don-row{margin:9px 0; font-size:.86rem; line-height:1.55; color:var(--text-2)}
  .don-row b{color:var(--text); font-weight:600}
  .don-note{font-size:.76rem; color:var(--text-3)}
  .iban{margin:10px 0; padding:11px; border:1px dashed var(--line-2); border-radius:10px; background:var(--card); text-align:center; word-break:break-all; font:500 .86rem var(--mono); letter-spacing:.03em}
  .btn-satispay{display:flex; align-items:center; justify-content:center; gap:9px; margin-top:12px; padding:12px; border-radius:12px; text-decoration:none; background:#f94c43; color:#fff; font:600 .9rem/1 var(--body); transition:.15s}
  .btn-satispay:hover{background:#e03e36; transform:translateY(-1px)}
  .cw-head{position:relative; padding:28px 24px 18px}
  .cw-head::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .cw-k{font:500 .68rem/1 var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--text-3)}
  .cw-head h2{display:flex; align-items:center; gap:10px; margin-top:10px; font:600 clamp(1.5rem,5vw,1.9rem)/1.1 var(--display); letter-spacing:-.02em}
  .cw-head h2 .cdot{width:.5em; height:.5em}
  .cw-n{position:absolute; right:24px; bottom:14px; font:300 2.6rem/1 var(--display); letter-spacing:-.03em; color:var(--text)}
  .cwin-list{list-style:none; padding:0; margin:6px 20px 0; display:flex; flex-direction:column; gap:6px}
  .cwin-list li{display:flex; align-items:center; gap:10px; padding:10px 13px; border-radius:10px; background:var(--card-2); border:1px solid var(--line); font-weight:500; font-size:.88rem}
  .cwin-list li .ic{color:var(--gold)}
  .cwin-list .cwc{font-weight:400; color:var(--text-2)}
  .cwin-empty{margin:16px 20px 0; text-align:center; color:var(--text-2); font-size:.9rem}
  .cwin-go{margin:14px 20px 0}

  /* ---------- albo d'oro e capitani ---------- */
  .honor{display:flex; flex-direction:column; gap:8px}
  .hrow{position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px 14px 0; border-radius:12px; overflow:hidden; background:var(--card-2); border:1px solid var(--line); transition:border-color .15s}
  .hrow[data-action]{cursor:pointer}
  .hrow[data-action]:hover{border-color:var(--line-2)}
  .hrow::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .hcount{flex:none; width:54px; padding-left:6px; text-align:center; font:300 1.9rem/1 var(--display); letter-spacing:-.03em; color:var(--gold-ink)}
  .hall-d .hcount{color:var(--silver-ink)}
  .hbody{display:flex; flex-direction:column; gap:3px; min-width:0}
  .hname{font:600 1.05rem/1.1 var(--display); letter-spacing:-.01em}
  .hyears{font-size:.78rem; color:var(--text-2)}
  .hgo{margin-left:auto; color:var(--text-3)}
  .albo-wrap{overflow:auto; border:1px solid var(--line); border-radius:12px}
  table.albo{border-collapse:separate; border-spacing:0; width:100%; min-width:720px; font-size:.86rem}
  table.albo th, table.albo td{padding:10px 11px; border-bottom:1px solid var(--line); text-align:center}
  table.albo tbody tr:last-child td{border-bottom:0}
  table.albo thead th{position:relative; padding:12px 11px 14px; background:var(--card-2); font:500 .74rem/1 var(--body); letter-spacing:.06em; text-transform:uppercase; color:var(--text-2)}
  table.albo thead th::after{content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg,var(--c1,var(--line-2)) 0 50%,var(--c2,var(--line-2)) 50% 100%)}
  table.albo td.anno{background:var(--card-2); color:var(--text-2); font:500 .95rem/1 var(--display)}
  table.albo td.win-p{background:var(--gold-bg); color:var(--gold-ink); font-weight:600}
  table.albo td.win-d{background:var(--silver-bg); color:var(--silver-ink); font-weight:600}
  table.albo td.win-pd{background:linear-gradient(115deg,var(--gold-bg) 0 50%,var(--silver-bg) 50% 100%); color:var(--text); font-weight:600}
  .wi{display:inline-flex; gap:3px; margin-left:6px; vertical-align:-3px}
  .wi .ic{width:15px; height:15px}
  .albo-legend{display:flex; gap:8px 20px; flex-wrap:wrap; margin-top:14px; font-size:.78rem; color:var(--text-2)}
  .albo-legend span{display:inline-flex; align-items:center; gap:7px}
  .albo-legend .ic{width:15px; height:15px}
  .sw{display:inline-block; width:14px; height:14px; border-radius:4px; border:1px solid var(--line-2)}
  .sw-p{background:var(--gold-bg); border-color:var(--gold-line)}
  .sw-d{background:var(--silver-bg); border-color:var(--silver-line)}
  .sw-pd{background:linear-gradient(115deg,var(--gold-bg) 0 50%,var(--silver-bg) 50% 100%)}
  .acard{margin-bottom:10px; padding:14px; border-radius:14px; background:var(--card); border:1px solid var(--line)}
  .acard h3{margin-bottom:10px; font:600 1.2rem/1 var(--display); letter-spacing:-.015em}
  .arow{position:relative; display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:4px; padding:9px 12px 9px 16px; border-radius:8px; background:var(--card-2); font-size:.86rem; overflow:hidden}
  .arow::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .arow .an{font:600 .88rem var(--display)}
  .arow .av{text-align:right}
  .arow.win-p{background:var(--gold-bg); color:var(--gold-ink); font-weight:600}
  .arow.win-d{background:var(--silver-bg); color:var(--silver-ink); font-weight:600}
  .arow.win-pd{background:linear-gradient(115deg,var(--gold-bg) 0 50%,var(--silver-bg) 50% 100%); font-weight:600}

  /* ---------- esplora le contrade ---------- */
  .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr)); gap:14px}
  .tcard{
    appearance:none; -webkit-appearance:none; margin:0; text-align:left; cursor:pointer; position:relative; overflow:hidden; color:var(--text);
    display:flex; flex-direction:column; gap:8px; padding:20px 22px 20px 26px; border-radius:var(--r);
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); transition:border-color .15s,transform .15s;
  }
  .tcard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .tcard:hover{border-color:var(--line-2); transform:translateY(-2px)}
  .t-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .t-name{display:inline-flex; align-items:center; gap:10px; font:600 1.3rem/1.1 var(--display); letter-spacing:-.015em}
  .t-name .cdot{width:.52em; height:.52em}
  .t-sub{font-size:.84rem; color:var(--text-2)}
  .t-meta{display:flex; align-items:center; gap:14px}
  .t-meta .chip{padding:0; background:none; border:0; font:500 1.05rem/1 var(--body); color:var(--text)}
  .t-meta .chip .ic{width:16px; height:16px; color:var(--gold)}
  .t-meta .chip.d .ic{color:var(--silver)}
  .t-go{color:var(--text-3); display:inline-flex}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); font:500 .78rem/1 var(--body); color:var(--text-2); white-space:nowrap}
  .chip .ic{width:13px; height:13px}
  .chip.ok{color:var(--live-ink); border-color:var(--live-line); background:var(--live-bg)}
  .tbar{display:flex; align-items:center; gap:12px 14px; flex-wrap:wrap; margin-bottom:18px}
  .tchips{display:flex; gap:8px; flex-wrap:wrap}
  .tchip{appearance:none; -webkit-appearance:none; cursor:pointer; display:inline-flex; align-items:center; gap:9px; padding:9px 15px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font:500 .86rem/1 var(--body)}
  .tchip i{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .tchip:hover{border-color:var(--line-2); background:var(--card-2)}
  .tchip.on{background:var(--inv-bg); color:var(--inv-fg); border-color:var(--inv-bg)}
  .chero{
    position:relative; overflow:hidden; display:flex; align-items:stretch; justify-content:space-between; gap:24px;
    padding:36px 40px 34px; margin-bottom:16px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
    animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  .chero::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .chero-in{min-width:0}
  .chero-k{margin-bottom:14px; font:500 .68rem/1 var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--text-3)}
  .hero-name.big{font:500 clamp(2rem,4.4vw,3rem)/1.05 var(--display); letter-spacing:-.03em}
  .hero-name.big .cdot{width:.5em; height:.5em}
  .chero-motto{margin-top:12px; font-size:1rem; font-style:italic; color:var(--text-2); max-width:52ch}
  .chero .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px}
  .chero-side{flex:none; display:flex; flex-direction:column; justify-content:center; align-items:center; min-width:150px; padding-left:32px; border-left:1px solid var(--line); text-align:center}
  .chero-side b{display:block; font:300 clamp(3rem,6vw,4.2rem)/1 var(--display); letter-spacing:-.04em; font-variant-numeric:tabular-nums}
  .chero-side span{display:block; margin-top:8px; font:400 .9rem var(--body); color:var(--text-2)}
  .bk{padding:16px 0; border-bottom:1px solid var(--line)}
  .bk:first-of-type{padding-top:0}
  .bk-h{display:flex; flex-direction:column; gap:4px; margin-bottom:14px}
  .bk-k{display:inline-flex; align-items:center; gap:8px; font:500 .68rem var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--gold-ink)}
  .bk.d .bk-k{color:var(--silver-ink)}
  .bk-h b{font:300 3rem/1 var(--display); letter-spacing:-.04em; color:var(--text)}
  .yrs{display:flex; gap:8px; flex-wrap:wrap}
  .yr{padding:7px 14px; border-radius:999px; font:500 .86rem/1 var(--body); border:1px solid transparent; font-variant-numeric:tabular-nums}
  .yr.p{background:var(--gold-bg); color:var(--gold-ink); border-color:var(--gold-line)}
  .yr.d{background:var(--silver-bg); color:var(--silver-ink); border-color:var(--silver-line)}
  .facts{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:14px; font-size:.88rem; color:var(--text-2)}
  .facts li{display:flex; gap:12px; align-items:center}
  .facts .ic{flex:none; box-sizing:content-box; width:16px; height:16px; padding:11px; border-radius:50%; background:var(--card-2); color:var(--text-2)}
  .facts b{color:var(--text); font-weight:600}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); margin-top:26px}
  .stat{padding:4px 18px; border-left:1px solid var(--line)}
  .stat:first-child{padding-left:0; border-left:0}
  .stat b{display:block; font:300 2.5rem/1 var(--display); letter-spacing:-.04em; font-variant-numeric:tabular-nums}
  .stat span{display:block; margin-top:8px; font:400 .84rem/1.2 var(--body); color:var(--text-2)}
  .rankpair{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .rt{padding:18px 20px; border-radius:14px; background:var(--card-2); border:1px solid var(--line)}
  .rt .k{display:flex; align-items:center; gap:7px; font:500 .68rem var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--gold-ink)}
  .rt.d .k{color:var(--silver-ink)}
  .rt .k .ic{width:13px; height:13px}
  .rt b{display:inline-block; margin-top:10px; font:300 3rem/1 var(--display); letter-spacing:-.04em}
  .rt .v{margin-left:10px; font-size:.9rem; color:var(--text-2); font-variant-numeric:tabular-nums}
  .wins-h{margin:30px 0 12px; font:500 .68rem var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--text-3)}
  .wins{display:flex; gap:8px; flex-wrap:wrap}
  .wchip{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); font-size:.82rem; font-weight:500}
  .wchip .cwc{font-weight:400; color:var(--text-2)}
  .tl{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:0 48px}
  .tl li{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line)}
  .tl li::before{content:""; flex:none; order:2; width:10px; height:10px; border-radius:50%; background:var(--card); border:1.5px solid var(--line-2)}
  .tl li.p::before,.tl li.pd::before{background:var(--gold); border-color:var(--gold)}
  .tl li.d::before{background:var(--silver); border-color:var(--silver)}
  .tl .y{order:1; min-width:44px; font:400 .88rem/1 var(--body); color:var(--text-3); font-variant-numeric:tabular-nums}
  .tl .n{order:3; flex:1; font-weight:500}
  .tl-note{order:4; display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font:500 .72rem var(--body); color:var(--text-2); background:var(--card-2); border:1px solid var(--line)}
  .tl-note .ic{width:12px; height:12px}
  .tl li.p .tl-note,.tl li.pd .tl-note{color:var(--gold-ink); background:var(--gold-bg); border-color:var(--gold-line)}
  .tl li.d .tl-note{color:var(--silver-ink); background:var(--silver-bg); border-color:var(--silver-line)}
  .story p{max-width:68ch; margin:0 0 12px; line-height:1.7; color:var(--text-2)}
  .story p:last-child{margin-bottom:0}

  /* ---------- gare e inserimento (admin) ---------- */
  .matrix-wrap{overflow:auto; max-height:max(340px,calc(100vh - 110px)); -webkit-overflow-scrolling:touch}
  table.matrix{border-collapse:separate; border-spacing:0; width:100%; min-width:800px; font-size:.86rem}
  table.matrix th, table.matrix td{padding:8px 9px; border-bottom:1px solid var(--line); text-align:center}
  table.matrix thead th{position:sticky; top:0; z-index:5; padding:11px 8px 10px; background:var(--card-2); border-bottom:1px solid var(--line-2)}
  table.matrix th.chead .cname{display:block; font:600 .92rem/1 var(--display)}
  table.matrix th.chead .cbar{display:block; height:3px; margin:8px auto 7px; width:56%; border-radius:2px; background:linear-gradient(90deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  table.matrix th.chead .coeff{display:block; font:500 .66rem var(--body); letter-spacing:.06em; text-transform:uppercase; color:var(--text-3)}
  table.matrix th.colNum, table.matrix th.colGara{font:500 .68rem var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3)}
  table.matrix .colNum{width:42px; color:var(--text-3); font-variant-numeric:tabular-nums}
  table.matrix .colGara{min-width:200px; text-align:left}
  table.matrix td.colNum, table.matrix td.colGara, table.matrix th.colNum, table.matrix th.colGara{position:sticky; z-index:4; background:var(--card)}
  table.matrix th.colNum, table.matrix th.colGara{z-index:7; background:var(--card-2)}
  table.matrix .colNum{left:0}
  table.matrix .colGara{left:42px; border-right:1px solid var(--line-2)}
  table.matrix tbody tr:hover td{background:var(--card-2)}
  table.matrix tbody tr.nondisp td{color:var(--text-2)}
  table.matrix tr.grouprow td.grouphdr{
    position:sticky; left:0; z-index:3; padding:10px 14px; text-align:left; background:var(--card-2); border-top:1px solid var(--line-2);

    appearance:none; -webkit-appearance:none; width:60px; padding:7px 4px; border-radius:8px; text-align:center; text-align-last:center;

  table.matrix tfoot td{position:sticky; bottom:0; z-index:5; padding:11px 8px; background:var(--card-2); border-top:1px solid var(--line-2); border-bottom:0}
  table.matrix tfoot td.colNum, table.matrix tfoot td.colGara{z-index:7; background:var(--card-2); font:500 .7rem var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--text-2)}
  tfoot .tp{display:block; font:600 1.2rem/1 var(--display); font-variant-numeric:tabular-nums}

  /* mobile: una scheda per gara */

  .gnum{margin-right:7px; font-size:.82rem; font-weight:400; color:var(--text-3)}
  .gcard .tipo{min-width:100px}
  .mrow{display:grid; grid-template-columns:1fr auto; grid-template-areas:"n s" "p s"; column-gap:12px; row-gap:2px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0; padding-bottom:2px}

  /* ---------- grafici ---------- */
  .chart{position:relative}
  .chart svg{display:block; width:100%; height:auto; touch-action:pan-y}
  .chart .gl{stroke:var(--line); stroke-width:1}
  .chart .ax{fill:var(--text-3); font:500 10.5px var(--body); font-variant-numeric:tabular-nums}

  .chart .pt{stroke:var(--card); stroke-width:2}
  .chart .cur{opacity:0; transition:opacity .12s}

  .chart .xh{stroke:var(--text-3); stroke-width:1; stroke-dasharray:3 3}

  .tt-h{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--line); font-size:.76rem; color:var(--text-2)}

  .tt-r span{flex:1; font-weight:500}
  .tt-r b{font-variant-numeric:tabular-nums; font-weight:600}
  .legend{display:flex; gap:6px 18px; flex-wrap:wrap; justify-content:center; margin-top:14px}
  .legend span{display:inline-flex; align-items:center; gap:8px; font:500 .78rem var(--body); color:var(--text-2)}
  .legend i{width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%)}

  /* ---------- impostazioni ---------- */
  .tbl-scroll{overflow-x:auto}
  table.cfg{width:100%; border-collapse:collapse; font-size:.84rem}
  table.cfg th, table.cfg td{padding:7px 7px; border-bottom:1px solid var(--line); text-align:center}
  table.cfg th{font:500 .68rem var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3)}
  table.cfg input:not([type=color]){width:100%}
  table.cfg input.num{max-width:84px; text-align:center}
  table.cfg input[type=color]{width:100%; min-width:42px; height:36px; padding:2px; border:1px solid var(--line-2); border-radius:8px; background:transparent; cursor:pointer}
  table.cfg td.cn{text-align:left; min-width:150px}
  table.cfg td.cn .flag{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:9px; vertical-align:middle; background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  table.cfg td.cn input{width:calc(100% - 20px)}
  .gare-edit .ge-row{display:grid; grid-template-columns:32px 1.4fr 1.1fr 120px auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line)}
  .gare-edit .ge-row input, .gare-edit .ge-row select{width:100%}
  .gare-edit .ge-head{font:500 .68rem var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3)}
  .gare-edit .ge-num{text-align:center; font-size:.78rem; color:var(--text-3)}
  .iconbtn{display:inline-grid; place-items:center; width:34px; height:34px; padding:0; border-radius:10px; cursor:pointer; background:var(--card); color:var(--text-2); border:1px solid var(--line-2)}
  .iconbtn:hover{color:var(--text); border-color:var(--text-3)}
  .iconbtn.del:hover{color:var(--danger); border-color:var(--danger)}
  .card.demo{border-style:dashed}

  /* ---------- piè di pagina ---------- */
  #siteFooter{display:flex; align-items:center; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; max-width:1280px; margin:0 auto; padding:26px max(24px,env(safe-area-inset-right)) 34px max(24px,env(safe-area-inset-left)); border-top:1px solid var(--line)}
  .ft-l{display:flex; align-items:center; gap:11px; font:500 .86rem var(--body); color:var(--text-2)}
  .ft-l .stripes{height:18px}
  #siteFooter p{font:400 .8rem var(--body); color:var(--text-3)}

  /* ---------- avviso a comparsa ---------- */
  #toast{
    position:fixed; left:50%; bottom:28px; z-index:200; display:flex; align-items:center; gap:10px; max-width:calc(100vw - 32px); padding:12px 18px;
    border-radius:12px; border:1px solid var(--live-line); background:var(--card); color:var(--text); font-weight:500; font-size:.86rem;
    box-shadow:0 20px 50px -14px rgba(20,24,31,.35); transform:translate(-50%,24px); opacity:0; pointer-events:none; transition:opacity .25s,transform .25s;
  }
  #toast.on{opacity:1; transform:translate(-50%,0)}
  #toast .ic{color:var(--live-ink)}
  #toast.err{border-color:var(--warn-line)}
  #toast.err .ic{color:var(--danger)}

  /* ---------- presentazione a schermo intero ---------- */
  #present{
    position:fixed; inset:0; z-index:100; display:none; flex-direction:column; padding:3.4vh 3.4vw 3vh; overflow:auto;
    background:var(--bg);
  }
  #present.on{display:flex}
  .pr-top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px 30px; flex-wrap:wrap; margin-bottom:3vh}
  .pr-brand{display:flex; align-items:center; gap:10px; margin-bottom:1.2vh; font:600 clamp(1rem,1.5vw,1.3rem)/1 var(--display)}
  .pr-brand em{color:var(--text-3); font-style:normal; font-weight:400}
  .pr-brand .stripes{height:20px}
  #presTitle{font:500 clamp(2rem,4.6vw,3.6rem)/1 var(--display); letter-spacing:-.03em}
  #presTitle .g,#presTitle .g.s{color:inherit}
  .pr-ctl{display:flex; align-items:center; gap:12px}
  .pr-grid{flex:1; display:grid; grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr); gap:3.4vw; align-items:end}
  .pr-grid.solo{grid-template-columns:minmax(0,1fr); align-items:center; max-width:1100px; width:100%; margin:0 auto}
  .podium{display:flex; align-items:flex-end; justify-content:center; gap:1.1vw}
  .pcol{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:.8vh}
  .pscore{font:300 clamp(1.5rem,2.6vw,2.4rem)/1 var(--display); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .pname{text-align:center; font:600 clamp(.95rem,1.6vw,1.4rem)/1.1 var(--display)}
  .podium .block{
    width:100%; min-height:70px; display:flex; align-items:flex-start; justify-content:center; padding-top:1vh; border-radius:14px 14px 0 0;
    background:var(--card); border:1px solid var(--line); border-bottom:0; box-shadow:var(--shadow);
  }
  .podium .block::before{content:""; position:absolute}
  .podium .block{position:relative; overflow:hidden}
  .podium .block::before{left:0; right:0; top:0; height:4px; background:linear-gradient(90deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .podium .block b{font:300 clamp(2rem,3.8vw,3.4rem)/1 var(--display); letter-spacing:-.03em; margin-top:.6vh}
  .bigstand{display:flex; flex-direction:column; gap:1.2vh; width:100%}
  .br{position:relative; display:grid; grid-template-columns:clamp(46px,4.6vw,76px) minmax(0,1fr) auto; align-items:center; gap:1.4vw; padding:1.8vh 2.2vw 1.8vh 0; overflow:hidden; border-radius:14px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
  .br .r{padding-left:.6vw; text-align:center; font:400 clamp(1.2rem,2.2vw,2rem)/1 var(--display); color:var(--text-3)}
  .br .n span{display:inline-flex; align-items:center; gap:.7vw; font:500 clamp(1.2rem,2.3vw,2.1rem)/1.1 var(--display); letter-spacing:-.015em}
  .br .n span::before{content:""; width:.5em; height:.5em; border-radius:50%; background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%)}
  .br .meter{height:.7vh; min-height:4px}
  .br .t{font:300 clamp(1.8rem,3.4vw,3rem)/1 var(--display); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .br.p1 .r{color:var(--text); font-weight:600}
  .pr-foot{margin-top:2.6vh}
  .pr-foot .prog{margin:0}

  /* ---------- animazioni ---------- */
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}}
  @keyframes bars{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
  @keyframes flip{0%,55%{transform:rotate(0)}85%,100%{transform:rotate(180deg)}}
  @keyframes confFall{0%{transform:translateY(-20px) rotate(0deg)}100%{transform:translateY(300px) rotate(560deg)}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }

  /* ---------- tablet e telefono ---------- */
  @media (max-width:1079px){
    .cl-grid{grid-template-columns:minmax(0,1fr); grid-template-rows:none; grid-template-areas:"hero" "prog" "main"}
  }
  @media (max-width:979px){
    .pr-grid{grid-template-columns:minmax(0,1fr)}
    .podium{max-width:560px; margin:0 auto 1vh; width:100%}
  }
  @media (max-width:759px){
    body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
    .top-in{grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"brand bar"; padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left)); gap:10px}
    #top.many .top-in{grid-template-areas:"brand bar"; gap:10px}
    .brand{gap:9px}
    #saveBadge{display:none}
    .brand-t b,.brand-t em{font-size:1.08rem}
    .stripes{height:20px}
    .cbadge{padding:6px 10px; font-size:.74rem}
    #adminBtn span{display:none}
    #adminBtn{padding:6px 8px}
    #adminBtn .ic{width:15px; height:15px}
    /* schede in basso, come in un'app */
    #nav{
      position:fixed; left:0; right:0; bottom:0; z-index:60; justify-content:stretch; gap:0; padding:0 0 env(safe-area-inset-bottom); overflow:visible;

    }

    .tab .ic{width:21px; height:21px}
    .tab .nl{display:none} .tab .ns{display:inline}
    .tab.on{color:var(--text)}

    main{padding:20px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
    .vhead{margin-bottom:16px}
    .vtitle{font-size:clamp(1.7rem,8vw,2rem)}
    .seg{display:flex; width:100%}
    .seg-b{flex:1; justify-content:center}
    .vh-r{width:100%}
    .cl-grid{gap:12px}
    .hero{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"k k" "name score" "meta score"; align-items:center; gap:0 12px; padding:20px 20px 18px}
    .hero-k{grid-area:k; margin-bottom:12px}
    .hero-name{grid-area:name; font-size:1.2rem}
    .hero-meta{grid-area:meta; margin:6px 0 0; padding:0; border:0; justify-content:flex-start; gap:8px; font-size:.82rem}

    .hero.idle{display:block}
    .prog{padding:16px 18px 18px}
    .prog-k{display:none}
    .prog-l{margin-bottom:12px}
    .prog-l b,.prog-l .of{font-size:1.05rem; font-weight:600; letter-spacing:0}
    .prog-l .of{font-weight:600; color:var(--text-3)}
    .ticks{height:14px; gap:2px}
    .srow{grid-template-columns:22px minmax(0,1fr) auto; gap:0 10px; padding:18px 18px}
    .nome{font-size:1.1rem}
    .meter{margin-top:11px}
    .tot{font-size:1.9rem}
    .gap{margin-top:6px}
    .cwin-hint{padding:4px 9px}
    .cwin-hint .wtxt{display:none}
    .card{padding:18px}
    .card.flush{padding:0}
    .rankpair{grid-template-columns:1fr}
    .don-box{padding:22px 18px}
    .announce{margin-bottom:20px}
    .a-block{padding:16px 18px; gap:14px}
    .a-block + .a-block{border-left:0; border-top:1px solid var(--line)}
    .support-banner{flex-wrap:wrap; padding:16px 18px; gap:12px 14px}
    .sb-tx{flex-basis:calc(100% - 64px)}
    .sb-cta{width:100%; justify-content:center}
    #toast{bottom:calc(78px + env(safe-area-inset-bottom))}
    #siteFooter{padding-bottom:26px; flex-direction:column; align-items:flex-start}
    .tgrid{grid-template-columns:1fr; gap:12px}
    .tcard{padding:16px 18px 16px 22px}
    .t-name{font-size:1.2rem}
    .chero{flex-direction:column; align-items:flex-start; gap:18px; padding:24px 20px 22px}

    .chero-side span{margin-top:0}
    .chero-side b{font-size:2.6rem}
    .stats{grid-template-columns:1fr 1fr; gap:22px 0}

    .tl{grid-template-columns:1fr}

    .gare-edit .ge-row{grid-template-columns:26px 1fr 1fr}

  }

  /* ---------- stampa ---------- */
  @media print{
    #top,#toast,.no-print,#present,.support-banner{display:none!important}
    html,body{background:#fff!important; color:#000}
    .card,.srow{border-color:#999; background:#fff!important; color:#000; box-shadow:none}
  }
</style>
</head>

// normalizza i dati che arrivano da Firebase (array<->oggetto, pos mancanti)
function normalizeState(s){
  if(!s || typeof s!=='object') return null;
  if(s.gare && !Array.isArray(s.gare)) s.gare = Object.values(s.gare);
  if(s.contrade && !Array.isArray(s.contrade)) s.contrade = Object.values(s.contrade);
  if(s.tabellaPunti) for(const k in s.tabellaPunti){ const v=s.tabellaPunti[k]; if(v && !Array.isArray(v)) s.tabellaPunti[k]=Object.values(v); }
  return s;
}

function initCloud(){
  if(cloudInited) return; cloudInited=true;
  if(typeof firebase==='undefined' || !FIREBASE_CONFIG.databaseURL){ updateTopbar(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    auth = firebase.auth ? firebase.auth() : null;
    cloudOn = true;
    // riprende dalla cache l'ultimo stato pubblico noto: niente "flash" del messaggio d'attesa al riavvio
    try{ const cp=localStorage.getItem('palioPublicCache'); if(cp){ publicData=JSON.parse(cp); publicLoaded=true; } }catch(e){}
    db.ref('.info/connected').on('value', s=>{ cloudConnected=(s.val()===true); updateTopbar(); });
    // PUBBLICAZIONE (snapshot congelato): leggibile da tutti
    db.ref(CLOUD_PATH+'/public').on('value', snap=>{
      publicData = snap.val();
      publicLoaded = true;
      try{ localStorage.setItem('palioPublicCache', JSON.stringify(publicData)); }catch(e){}

  }catch(e){ cloudOn=false; console.warn('cloud init fail', e); }

}

function subscribeState(){
  if(!db || stateRef) return;

  stateRef.on('value', snap=>{
    const remote = snap.val();
    if(!(remote && remote.data)){ if(isAdmin) pushCloud(); return; } // vuoto: l'admin lo inizializza
    if(remote.updatedBy === myId) return;               // eco del nostro stesso aggiornamento
    const s = migrate(normalizeState(remote.data));

    liveState = s;

      state = s; saveLocal(); render();
      if(document.getElementById('present').classList.contains('on')) renderPresent();
      applyingRemote = false;
    }
  }, err=>console.warn('state read err (permessi?)', err));
}

/* ===================== FUNZIONI PURE DI CALCOLO ===================== */
const contrada = cid => state.contrade.find(c=>c.id===cid);
const coeff = cid => contrada(cid).coeff;
function puntiPalio(g, cid){
  const p = g.pos[cid];
  if(p==null) return 0;
  const arr = state.tabellaPunti[g.tipo];
  return arr ? (Number(arr[p-1])||0) : 0;
}
const puntiDrappo = (g, cid) => puntiPalio(g, cid) * coeff(cid);
const disputata = g => state.contrade.some(c => g.pos[c.id]!=null);

// somme cumulative su gare disputate, in ordine
function calcola(){
  const disp = state.gare.filter(disputata);
  const palio = {}, drappo = {}, totP = {}, totD = {};
  state.contrade.forEach(c=>{ palio[c.id]=[]; drappo[c.id]=[]; totP[c.id]=0; totD[c.id]=0; });
  disp.forEach(g=>{
    state.contrade.forEach(c=>{
      totP[c.id]+=puntiPalio(g,c.id);
      totD[c.id]+=puntiDrappo(g,c.id);
      palio[c.id].push(totP[c.id]);
      drappo[c.id].push(totD[c.id]);
    });
  });
  return {disp, palio, drappo, totP, totD};
}
// classifica con ranking 1-2-2-4 (pareggio su valore arrotondato a 2 dec)
function classifica(tipo){
  const {totP,totD} = calcola();
  const tot = tipo==='palio' ? totP : totD;
  const arr = state.contrade.map(c=>({c, val:tot[c.id]}));
  arr.sort((a,b)=> (b.val-a.val) || a.c.nome.localeCompare(b.c.nome,'it'));
  let prev=null;
  arr.forEach((e,i)=>{
    const rv = Math.round(e.val*100)/100;
    if(i>0 && Math.abs(rv-prev)<0.005){ e.rank = arr[i-1].rank; }
    else { e.rank = i+1; }
    prev = rv;
  });
  return arr;
}

/* ---------- colori: scelta del testo (bianco o scuro) con il miglior contrasto ---------- */
function lum(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return .2;
  const n = parseInt(m[1],16);
  const f = v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); };
  return .2126*f(n>>16&255) + .7152*f(n>>8&255) + .0722*f(n&255);
}
const INK_DARK = '#0a0e17';
// testo e testo "inverso" (per etichette) da usare sopra uno sfondo fatto di questi colori
function inkFor(cols){
  const ls = cols.map(lum);
  const cw = Math.min(...ls.map(l=>1.05/(l+.05)));
  const cb = Math.min(...ls.map(l=>(l+.05)/(.0045+.05)));
  return cw >= cb ? {fg:'#ffffff', rev:INK_DARK} : {fg:INK_DARK, rev:'#ffffff'};
}
// colore a metà strada fra due esadecimali (t da 0 a 1)
function mixHex(a, b, t){
  const pa = /^#?([0-9a-f]{6})$/i.exec(a||''), pb = /^#?([0-9a-f]{6})$/i.exec(b||'');
  if(!pa || !pb) return a;
  const na = parseInt(pa[1],16), nb = parseInt(pb[1],16);
  return '#' + [16,8,0].map(s=>Math.round(((na>>s)&255)*(1-t) + ((nb>>s)&255)*t).toString(16).padStart(2,'0')).join('');
}
// testo più leggibile su un tratto [da, a] (0-1) del gradiente c1 → c2
function inkSpan(c1, c2, from, to){
  const cols = []; for(let i=0;i<=6;i++) cols.push(mixHex(c1, c2, from + (to-from)*i/6));
  return inkFor(cols);
}
// variabili CSS di una contrada (colori della bandiera e del grafico)
const cVars = c => `--c1:${c.c1};--c2:${c.c2};--cc:${c.chart};--cl:${lift(c.c1)}`;

let _toastT = null;
function toast(msg, kind){
  const el = document.getElementById('toast'); if(!el) return;
  el.innerHTML = (kind==='err' ? ic('alert') : ic('check')) + '<span>'+esc(msg)+'</span>';

}

/* ===================== VISTA PUBBLICA (visitatori) ===================== */
function renderViewer(){
  const nav = document.getElementById('nav'), app = document.getElementById('app');
  // finché non sappiamo lo stato pubblico reale, mostriamo un caricamento neutro (non il messaggio d'attesa)
  if(!publicLoaded){ nav.style.display='none'; app.innerHTML = viewLoading(); return; }
  const revealed = !!(publicData && publicData.revealed===true);
  // Albo d'Oro e Contrade sono storia: restano accessibili anche a risultati nascosti
  const pick = id => VIEWS.find(v=>v.id===id);
  const items = revealed
    ? ['palio','drappo','grafici','contrade','albo'].map(pick)
    : [{id:'attesa', label:'Risultati', short:'Risultati', ic:'hourglass'}, pick('contrade'), pick('albo')];
  const home = items[0].id;                         // la prima scheda è la home
  if(!items.some(v=>v.id===current)) current = home;
  nav.style.display='';
  document.getElementById('top').classList.remove('many');
  nav.innerHTML = navHTML(items);
  // con le classifiche pubblicate si usa lo snapshot congelato (vale anche per la scheda Contrade)
  if(revealed){
    const snap = migrate(normalizeState(JSON.parse(JSON.stringify(publicData.snapshot||{}))));
    if(snap) state = snap;
  }
  const sb = supportBannerCompact();
  if(current==='albo'){ app.innerHTML = viewAlbo() + sb; return; }
  if(current==='contrade'){ app.innerHTML = viewContrade(revealed) + sb; return; }
  const ann = current===home ? announceBanner() : '';   // il banner dei vincitori compare solo in home
  if(!revealed){
    app.innerHTML = ann + viewWait(publicData && publicData.message);
    return;
  }
  const lab = publicData.label && publicData.label.trim() ? publicData.label : 'Classifica ufficiale';
  if(current==='palio')       app.innerHTML = ann+viewClassifica('palio', lab)+sb;
  else if(current==='drappo') app.innerHTML = ann+viewClassifica('drappo', lab)+sb;
  else if(current==='grafici')app.innerHTML = ann+viewGrafici(lab)+sb;
  if(current==='grafici') drawCharts();
}

function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  return new Promise((res,rej)=>{
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
    document.body.removeChild(ta);
  });
}

function confettiHTML(colors, n){
  n = n || 46;
  let s = '';
  for(let i=0;i<n;i++){
    const c = colors[i % colors.length];
    const left = Math.random()*100;
    const dur = 2.8 + Math.random()*2.8;
    const delay = -(Math.random()*dur);            // negativo: pioggia già in corso al primo render
    const w = 6 + Math.random()*5, h = 10 + Math.random()*8;
    s += `<i class="confetti" style="left:${left.toFixed(1)}%;background:${c};width:${w.toFixed(0)}px;height:${h.toFixed(0)}px;animation-duration:${dur.toFixed(2)}s;animation-delay:${delay.toFixed(2)}s"></i>`;
  }
  return s;
}
const ANN_TYPES = [['palio','trophy','Vincitore del Palio'],['drappo','flag','Vincitore del Drappo']];
const annWinners = it => it ? (Array.isArray(it.winners) ? it.winners : Object.values(it.winners||{})) : [];
function announceBanner(){
  const a = publicData && publicData.announce;
  if(!a) return '';
  const present = ANN_TYPES.filter(([t])=> a[t] && annWinners(a[t]).length);
  if(!present.length) return '';
  const colors = [...new Set(present.flatMap(([t])=>annWinners(a[t]).flatMap(w=>[w.c1,w.c2])).concat(['#ffc72c','#ffffff']))];
  const blocks = present.map(([t,icon,tit])=>{
    const ws = annWinners(a[t]);
    const names = ws.map(w=>`<span class="a-name" style="--c1:${w.c1};--c2:${w.c2}"><i class="cdot"></i>${esc(w.nome)}</span>`);
    const verb = ws.length>1 ? 'Vincono' : 'Vince';
    return `<div class="a-block ${t==='drappo'?'d':'p'}">
      <span class="a-ic">${ic(icon)}</span>
      <div><div class="a-k">${tit}</div>
      <div class="a-win"><span class="a-verb">${verb}</span>${names.join('<span class="a-and">e</span>')}<span class="a-bang">!</span></div></div>
    </div>`;
  }).join('');
  return `<div class="announce" role="status">${confettiHTML(colors)}${blocks}</div>`;
}

/* ===================== VISTA: ALBO D'ORO E CAPITANI ===================== */
function viewAlbo(){
  const cinfo = cid => state.contrade.find(c=>c.id===cid) || {nome:cid, chart:'#888', c1:'#888', c2:'#888'};
  // albi calcolati dalle vittorie: oro = Palio, argento = Drappo
  const wins = {};
  ALBO.forEach(r=>{
    if(r.palio){ (wins[r.palio]=wins[r.palio]||{p:[],d:[]}).p.push(r.anno); }
    if(r.drappo){ (wins[r.drappo]=wins[r.drappo]||{p:[],d:[]}).d.push(r.anno); }
  });
  const honor = key => Object.entries(wins).filter(([,w])=>w[key].length)
    .sort((a,b)=> (b[1][key].length-a[1][key].length) || cinfo(a[0]).nome.localeCompare(cinfo(b[0]).nome,'it'))
    .map(([cid,w])=>{
      const c=cinfo(cid);
      return `<div class="hrow" style="${cVars(c)}" data-action="team" data-cid="${cid}" role="button" tabindex="0" title="Esplora ${esc(c.nome)}">
        <span class="hcount">${w[key].length}</span>
        <span class="hbody"><span class="hname">${esc(c.nome)}</span><span class="hyears">${w[key].join(' · ')}</span></span>
        <span class="hgo">${ic('arrow')}</span>
      </div>`;
    }).join('') || '<p class="muted">Ancora nessuna vittoria.</p>';

  const cellInfo = (r,cid)=>{
    const both = r.palio===cid && r.drappo===cid;
    return {
      cls: both?'win-pd':(r.palio===cid?'win-p':(r.drappo===cid?'win-d':'')),
      badge: both ? `<span class="wi">${ic('trophy')}${ic('flag')}</span>`
           : r.palio===cid ? `<span class="wi">${ic('trophy')}</span>`
           : r.drappo===cid ? `<span class="wi">${ic('flag')}</span>` : ''
    };
  };
  const head = ALBO_COLS.map(cid=>{const c=cinfo(cid);
    return `<th style="${cVars(c)}"><span class="ah">${esc(c.nome)}</span></th>`;}).join('');
  const rows = ALBO.map(r=>{
    const cells = ALBO_COLS.map(cid=>{
      const {cls,badge}=cellInfo(r,cid);
      return `<td class="${cls}"><span class="cap">${esc(r.cap[cid]||'')}</span>${badge}</td>`;
    }).join('');
    return `<tr><td class="anno">${r.anno}</td>${cells}</tr>`;
  }).join('');
  const cards = ALBO.map(r=>{
    const rws = ALBO_COLS.map(cid=>{
      const c=cinfo(cid);
      const {cls,badge}=cellInfo(r,cid);
      return `<div class="arow ${cls}" style="${cVars(c)}">
        <span class="an">${esc(c.nome)}</span>
        <span class="av">${esc(r.cap[cid]||'')}${badge}</span></div>`;
    }).join('');
    return `<div class="acard"><h3>${r.anno}</h3>${rws}</div>`;
  }).join('');
  const legend = `<div class="albo-legend">
    <span><i class="sw sw-p"></i>${ic('trophy')} Vittoria Palio</span>
    <span><i class="sw sw-d"></i>${ic('flag')} Vittoria Drappo</span>
    <span><i class="sw sw-pd"></i>Doppietta (Palio + Drappo)</span>
  </div>`;
  return `
  ${viewHead("Albo d'<span class=\"g\">Oro</span>", {eyebrow:'Palio Malaspina · dal '+ALBO[0].anno})}
  <div class="grid2 hall">
    <div class="card hall-p">
      <div class="sectionTitle"><span class="st-ic">${ic('trophy')}</span><h2>Palio</h2><span class="pill gold">Oro</span></div>
      <div class="honor">${honor('p')}</div>
    </div>
    <div class="card hall-d">
      <div class="sectionTitle"><span class="st-ic">${ic('flag')}</span><h2>Drappo</h2><span class="pill silver">Argento</span></div>
      <div class="honor">${honor('d')}</div>
    </div>
  </div>
  <div class="card">
    <div class="sectionTitle"><h2>Capitani</h2><span class="pill">Palio Malaspina</span></div>
    ${isMobile() ? cards : `<div class="albo-wrap"><table class="albo">
      <thead><tr><th>Edizione</th>${head}</tr></thead>
      <tbody>${rows}</tbody></table></div>`}
    ${legend}
  </div>`;
}
