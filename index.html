<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palio 2026 – Calcolo Punteggio</title>
<style>
  :root{
    --bg-1:#0d1117; --bg-2:#161b22; --bg-3:#1f2630; --bg-4:#2a3240;
    --border:#30363d; --text:#e6edf3; --text-dim:#8b949e;
    --accent:#d4af37; --accent-2:#f2c94c; --success:#2ea043; --danger:#da3633; --warn:#d29922;
    /* colori ufficiali contrade (riusati dalla companion app) */
    --andromeda:#9ca3af; --bosco:#f97316; --giardini:#16a34a; --lago:#1e40af; --sagittario:#ec4899;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #18202c 0%, var(--bg-1) 60%);
    color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}
  a{color:var(--accent)}
  /* ---------- header ---------- */
  header{
    padding:18px 20px 14px; text-align:center; position:relative;
    border-bottom:2px solid var(--accent); background:linear-gradient(180deg,#10161f,#0d1117);
  }
  header h1{
    margin:0; font-size:1.7rem; letter-spacing:3px;
    background:linear-gradient(180deg,var(--accent-2),var(--accent)); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent;
  }
  header p{margin:4px 0 0; color:var(--text-dim); letter-spacing:4px; font-size:.72rem; text-transform:uppercase}
  #saveBadge{
    position:absolute; right:16px; top:16px; font-size:.72rem; padding:4px 10px; border-radius:20px;
    border:1px solid var(--border); color:var(--text-dim); background:var(--bg-2); transition:.3s;
  }
  #saveBadge.ok{color:var(--success); border-color:var(--success)}
  #saveBadge.warn{color:var(--warn); border-color:var(--warn)}
  #topbar{position:absolute; left:14px; top:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .cbadge{font-size:.72rem; padding:4px 10px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); background:var(--bg-2)}
  .cbadge.live{color:var(--success); border-color:var(--success)}
  .cbadge.off{color:var(--warn); border-color:var(--warn)}
  .cbadge.btnlike{cursor:pointer; font-weight:600}
  .cbadge.btnlike:hover{border-color:var(--accent); color:var(--text)}
  .cbadge.btnlike.admin{color:#1a1205; background:linear-gradient(180deg,var(--accent-2),var(--accent)); border-color:var(--accent)}
  select:disabled, input:disabled{opacity:.5; cursor:not-allowed}
  .viewer-note{background:rgba(46,160,67,.10); border:1px solid var(--success); color:#9ae6b4; padding:9px 13px; border-radius:10px; margin-bottom:14px; font-size:.85rem}
  @media (max-width:720px){ #topbar{position:static; justify-content:center; margin-top:10px} #saveBadge{position:static; display:inline-block; margin-top:8px} header{padding-bottom:12px} }
  /* ---------- nav ---------- */
  nav{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:12px;
    position:sticky; top:0; z-index:30; background:rgba(13,17,23,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  nav button{
    background:var(--bg-2); color:var(--text-dim); border:1px solid var(--border);
    padding:9px 16px; border-radius:10px; cursor:pointer; font-size:.85rem; font-weight:600;
    letter-spacing:.5px; transition:.15s;
  }
  nav button:hover{color:var(--text); border-color:var(--accent)}
  nav button.active{
    color:#1a1205; background:linear-gradient(180deg,var(--accent-2),var(--accent));
    border-color:var(--accent); box-shadow:0 0 12px rgba(212,175,55,.35);
  }
  main{max-width:1180px; margin:0 auto; padding:18px 16px 60px}
  /* ---------- generici ---------- */
  .card{background:var(--bg-2); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:18px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .btn{
    background:var(--bg-3); color:var(--text); border:1px solid var(--border); padding:9px 14px;
    border-radius:10px; cursor:pointer; font-size:.85rem; font-weight:600;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.gold{background:linear-gradient(180deg,var(--accent-2),var(--accent)); color:#1a1205; border-color:var(--accent)}
  .btn.danger{background:var(--danger); color:#fff; border-color:var(--danger)}
  .btn.sm{padding:5px 9px; font-size:.78rem; border-radius:8px}
  .muted{color:var(--text-dim)}
  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:.7rem; font-weight:700; border:1px solid var(--border)}
  .sectionTitle{display:flex; align-items:center; gap:10px; margin:0 0 14px}
  .sectionTitle h2{margin:0; font-size:1.25rem; color:var(--accent)}
  .hint{font-size:.78rem; color:var(--text-dim); margin:8px 0 0; line-height:1.5}
  .banner{
    background:rgba(210,153,34,.12); border:1px solid var(--warn); color:#f0d68a;
    padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:.85rem;
    display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  }
  /* ---------- matrice gare ---------- */
  .matrix-wrap{overflow:auto; border:1px solid var(--border); border-radius:12px}
  table.matrix{border-collapse:separate; border-spacing:0; width:100%; font-size:.85rem; min-width:760px}
  table.matrix th, table.matrix td{padding:8px 9px; border-bottom:1px solid var(--border); text-align:center}
  table.matrix thead th{
    position:sticky; top:0; z-index:5; background:var(--bg-3); color:var(--text);
    font-size:.78rem; letter-spacing:.5px; border-bottom:2px solid var(--accent);
  }
  table.matrix thead th .coeff{display:block; font-size:.66rem; color:var(--text-dim); font-weight:400}
  table.matrix thead th .cname{display:block; font-weight:600}
  table.matrix thead th .cbar{display:block; height:3px; width:72%; margin:4px auto 3px; border-radius:3px}
  table.matrix .colNum{width:34px; color:var(--text-dim)}
  table.matrix .colGara{text-align:left; min-width:190px}
  table.matrix td.colNum, table.matrix td.colGara, table.matrix th.colNum, table.matrix th.colGara{
    position:sticky; left:0; background:var(--bg-2); z-index:4;
  }
  table.matrix th.colGara{z-index:6}
  table.matrix td.colNum{left:0; z-index:4}
  table.matrix td.colGara{left:34px; z-index:4; border-right:1px solid var(--border)}
  table.matrix th.colGara{left:34px}
  table.matrix tbody tr:hover td{background:var(--bg-3)}
  table.matrix tbody tr.nondisp td{opacity:.62}
  table.matrix tr.grouprow td.grouphdr{
    position:sticky; left:0; z-index:3; text-align:left;
    font-family:Georgia,serif; font-weight:700; font-size:.98rem; letter-spacing:.6px;
    color:var(--accent); background:#1c232e;
    border-top:1px solid var(--border); border-bottom:1px solid var(--accent);
    box-shadow:inset 4px 0 0 var(--accent); padding:9px 14px 8px;
  }
  table.matrix tr.grouprow:hover td{background:#1c232e}
  .gara-name{font-weight:700}
  .gara-cat{font-size:.74rem; color:var(--text-dim)}
  select.cell, select.tipo{
    background:var(--bg-1); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:5px 6px; font-size:.85rem; cursor:pointer; min-width:52px; text-align:center;
  }
  select.cell:focus, select.tipo:focus{outline:1px solid var(--accent); border-color:var(--accent)}
  select.cell.set{border-color:var(--accent)}
  td.cell.dup{outline:2px dashed var(--warn); outline-offset:-2px}
  .cellpts{display:block; font-size:.68rem; color:var(--accent); margin-top:3px; min-height:.9em}
  .tipo-badge{font-size:.66rem}
  tfoot td{background:var(--bg-3); font-weight:700; border-top:2px solid var(--accent)}
  tfoot .tp{color:var(--accent)} tfoot .td{color:var(--text-dim); font-weight:600; font-size:.74rem; display:block}
  /* ---------- classifiche ---------- */
  .standings{display:flex; flex-direction:column; gap:10px}
  .srow{
    display:grid; grid-template-columns:46px 1fr auto; align-items:center; gap:14px;
    background:var(--bg-3); border:1px solid var(--border); border-left:5px solid var(--cc,var(--border));
    border-radius:12px; padding:12px 16px;
  }
  .srow .rank{font-size:1.5rem; font-weight:800; color:var(--accent); text-align:center}
  .srow.p1{background:linear-gradient(90deg,rgba(255,215,0,.12),var(--bg-3)); border-left-color:#ffd700}
  .srow.p2{border-left-color:#c0c0c0}
  .srow.p3{border-left-color:#cd7f32}
  .srow .nome{font-weight:700; font-size:1.05rem; font-family:Georgia,serif}
  .srow .sub{font-size:.72rem; color:var(--text-dim)}
  .srow .bar{height:7px; border-radius:6px; margin-top:6px; background:var(--cc,var(--accent)); opacity:.85}
  .srow .tot{font-size:1.45rem; font-weight:800; color:var(--accent); white-space:nowrap}
  .srow .medal{font-size:1.2rem}
  /* ---------- grafici ---------- */
  .chart-card svg{width:100%; height:auto; display:block}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; justify-content:center}
  .legend span{display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--text-dim)}
  .legend i{width:14px; height:4px; border-radius:3px; display:inline-block}
  /* ---------- impostazioni ---------- */
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}
  table.cfg{width:100%; border-collapse:collapse; font-size:.84rem}
  table.cfg th, table.cfg td{padding:6px 8px; border-bottom:1px solid var(--border); text-align:center}
  table.cfg th{color:var(--text-dim); font-weight:600}
  table.cfg input{width:100%; background:var(--bg-1); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:5px 7px; font-size:.84rem}
  table.cfg input[type=color]{padding:1px; height:30px; cursor:pointer}
  table.cfg input.num{max-width:90px; text-align:center}
  .gare-edit .ge-row{display:grid; grid-template-columns:30px 1.4fr 1.1fr 110px auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border)}
  .gare-edit input, .gare-edit select{background:var(--bg-1); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:6px 8px; font-size:.82rem; width:100%}
  .gare-edit .ge-num{color:var(--text-dim); text-align:center; font-size:.8rem}
  .iconbtn{background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:7px; cursor:pointer; padding:4px 8px; font-size:.8rem}
  .iconbtn:hover{color:var(--text); border-color:var(--accent)}
  /* ---------- presentazione ---------- */
  #present{
    position:fixed; inset:0; z-index:100; background:radial-gradient(1200px 700px at 50% 0%, #18202c, #07090d 70%);
    display:none; flex-direction:column; padding:3vh 4vw; overflow:auto;
  }
  #present.on{display:flex}
  #present h2{font-size:clamp(1.6rem,4vw,3rem); text-align:center; margin:0 0 1vh;
    background:linear-gradient(180deg,var(--accent-2),var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  #present .ptoggle{display:flex; gap:10px; justify-content:center; margin-bottom:2vh}
  #present .pclose{position:absolute; top:18px; right:22px}
  .podium{display:flex; justify-content:center; align-items:flex-end; gap:2vw; margin:2vh 0 3vh}
  .podium .pcol{display:flex; flex-direction:column; align-items:center; gap:8px}
  .podium .block{width:16vw; max-width:200px; border-radius:14px 14px 0 0; display:flex; align-items:flex-end; justify-content:center;
    color:#0d1117; font-weight:800; font-size:clamp(1.4rem,3vw,2.4rem); padding-bottom:10px; border:1px solid rgba(255,255,255,.15)}
  .podium .pname{font-family:Georgia,serif; font-size:clamp(1rem,2.2vw,1.6rem); font-weight:700}
  .podium .pscore{color:var(--accent); font-weight:800; font-size:clamp(1.1rem,2.4vw,1.8rem)}
  .bigstand{display:flex; flex-direction:column; gap:1.2vh; max-width:900px; margin:0 auto; width:100%}
  .bigstand .br{display:grid; grid-template-columns:60px 1fr auto; align-items:center; gap:2vw;
    background:rgba(31,38,48,.7); border:1px solid var(--border); border-left:8px solid var(--cc); border-radius:14px; padding:1.4vh 2vw}
  .bigstand .br .r{font-size:clamp(1.4rem,3vw,2.2rem); font-weight:800; color:var(--accent); text-align:center}
  .bigstand .br .n{font-family:Georgia,serif; font-weight:700; font-size:clamp(1.2rem,2.6vw,2rem)}
  .bigstand .br .t{font-size:clamp(1.3rem,2.8vw,2.1rem); font-weight:800; color:var(--accent)}
  @media (max-width:640px){
    nav button{padding:7px 11px; font-size:.78rem}
    .srow{grid-template-columns:38px 1fr auto}
    .gare-edit .ge-row{grid-template-columns:24px 1fr 1fr; }
    .gare-edit .ge-row .ge-tipo, .gare-edit .ge-row .ge-actions{grid-column:span 3; justify-self:start}
  }
  /* stampa */
  @media print{
    nav,#saveBadge,.no-print,#present{display:none!important}
    body{background:#fff; color:#000}
    .card{border-color:#999}
  }
</style>
</head>
<body>
<header>
  <div id="topbar">
    <span id="cloudBadge" class="cbadge">⚪ Locale</span>
    <button id="adminBtn" class="cbadge btnlike" style="display:none">🔒 Admin</button>
  </div>
  <h1>PALIO 2026</h1>
  <p>Calcolo Punteggio · Classifica Palio &amp; Drappo</p>
  <span id="saveBadge">—</span>
</header>

<nav id="nav"></nav>
<main id="app"></main>

<!-- overlay presentazione -->
<div id="present">
  <button class="btn pclose no-print" data-action="present-close">✕ Chiudi</button>
  <h2 id="presTitle">Classifica Palio</h2>
  <div class="ptoggle">
    <button class="btn gold" data-action="present-mode" data-mode="palio" id="pmPalio">PALIO</button>
    <button class="btn" data-action="present-mode" data-mode="drappo" id="pmDrappo">DRAPPO</button>
  </div>
  <div id="presBody"></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<!-- Firebase (sincronizzazione condivisa in tempo reale). Se offline, l'app funziona in locale. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";

/* ===================== DATI PREDEFINITI ===================== */
const CONTRADE_DEF = [
  {id:'andromeda', nome:'Andromeda', coeff:3.33,    c1:'#9ca3af', c2:'#ffffff', chart:'#9ca3af'}, // grigio/bianco
  {id:'bosco',     nome:'Bosco',     coeff:1.25,    c1:'#f97316', c2:'#dc2626', chart:'#f97316'}, // arancio/rosso
  {id:'giardini',  nome:'Giardini',  coeff:1.10,    c1:'#facc15', c2:'#16a34a', chart:'#16a34a'}, // giallo/verde
  {id:'lago',      nome:'Lago',      coeff:100/85,  c1:'#1e40af', c2:'#38bdf8', chart:'#38bdf8'}, // blu/azzurro
  {id:'sagittario',nome:'Sagittario',coeff:2.00,    c1:'#ec4899', c2:'#1d4ed8', chart:'#ec4899'}, // rosa/blu
];
const TIPI = ['Punti 5','Punti 4','Punti 3','Punti B','Punti T'];
const TABELLA_DEF = {
  'Punti 5':[10,7,5,3,2],
  'Punti 4':[7,5,3,2,0],
  'Punti 3':[5,3,2,0,0],
  'Punti B':[5,4,3,2,1],
  'Punti T':[1,0,0,0,0],
};
// elenco gare (unione Excel + elenco sport ufficiale); [sport, categoria, tipo]
const GARE_DEF = [
  ['Maratona','Uomini','Punti 5'],
  ['Maratona','Donne','Punti 5'],
  ['Maratona','Juniores','Punti 5'],
  ['Pallavolo','Mista','Punti 5'],
  ['Pallavolo','Femminile','Punti 5'],
  ['Nuoto','Maschile Stile','Punti 5'],
  ['Nuoto','Maschile Rana','Punti 5'],
  ['Nuoto','Femminile Stile','Punti 5'],
  ['Nuoto','Femminile Rana','Punti 5'],
  ['Nuoto','Juniores Stile','Punti 5'],
  ['Nuoto','Juniores Rana','Punti 5'],
  ['Nuoto','Staffetta Mista','Punti 5'],
  ['Tennis','Maschile','Punti 5'],
  ['Tennis','Femminile','Punti 5'],
  ['Tennis','Doppio Misto','Punti 5'],
  ['Basket','Maschile','Punti 5'],
  ['Basket','Juniores','Punti 5'],
  ['Calcio','Maschile','Punti 5'],
  ['Calcio','Juniores','Punti 5'],
  ['Ping Pong','Maschile','Punti 5'],
  ['Ping Pong','Femminile','Punti 5'],
  ['Ping Pong','Doppio Misto','Punti 5'],
  ['Ping Pong','Juniores','Punti 5'],
  ['Ping Pong','14-17','Punti 5'],
  ['Calcio Balilla','Misto','Punti 5'],
  ['Calcio Balilla','Juniores','Punti 5'],
  ['Freccette','','Punti 5'],
  ['Bocce','Doppio Mix','Punti 5'],
  ['Scacchi','Adulti','Punti 5'],
  ['Burraco','Mix','Punti B'],
  ['Gara torte','Mix','Punti T'],
];

const STATE_VERSION = 1;
const STORE_KEY = 'palioCalcoloPunti';
let _uid = 1;
const uid = () => 'g' + (_uid++) + '_' + Math.floor(Math.random()*1e6).toString(36);

function emptyPos(){ const p={}; CONTRADE_DEF.forEach(c=>p[c.id]=null); return p; }

function defaults(){
  return {
    version: STATE_VERSION,
    contrade: CONTRADE_DEF.map(c=>({...c})),
    tabellaPunti: JSON.parse(JSON.stringify(TABELLA_DEF)),
    gare: GARE_DEF.map(([sport,categoria,tipo])=>({id:uid(), sport, categoria, tipo, pos:emptyPos()})),
  };
}

/* ===================== STATO + PERSISTENZA ===================== */
let state = null;
let storageOk = true;
let memFallback = null;

function migrate(s){
  if(!s || typeof s!=='object') return null;
  if(!Array.isArray(s.contrade) || !Array.isArray(s.gare) || !s.tabellaPunti) return null;
  // assicura campi minimi
  s.version = s.version || STATE_VERSION;
  s.gare.forEach(g=>{ if(!g.pos) g.pos=emptyPos(); if(!g.id) g.id=uid(); });
  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s = migrate(JSON.parse(raw)); if(s) return s; }
  }catch(e){ storageOk = false; }
  return null;
}
let saveTimer = null;
// salva in locale (backup) e, se admin e cloud attivo, sincronizza sul database condiviso
function save(){
  saveLocal();
  if(cloudOn && isAdmin && !applyingRemote) pushCloud();
}
function saveLocal(){
  badge('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const data = JSON.stringify(state);
    try{
      localStorage.setItem(STORE_KEY, data);
      storageOk = true; badge(cloudOn ? (isAdmin?'ok':'view') : 'ok');
    }catch(e){
      storageOk = false; memFallback = data; badge('warn');
    }
  }, 180);
}
function badge(mode){
  const el = document.getElementById('saveBadge');
  if(mode==='saving'){ el.textContent='Salvataggio…'; el.className=''; }
  else if(mode==='ok'){ el.textContent='Salvato ✓'; el.className='ok'; }
  else if(mode==='view'){ el.textContent='👁 Sola visione'; el.className=''; }
  else if(mode==='warn'){ el.textContent='⚠ Memoria temporanea'; el.className='warn'; el.title='localStorage non disponibile: i dati restano solo finché la pagina è aperta. Usa Esporta JSON per il backup.'; }
}

/* ===================== CLOUD (Firebase) + ADMIN ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCRXHYJ0q4rGLaJW4yyT0uwHNe9UDCgtQM",
  authDomain: "thepaliocalculator.firebaseapp.com",
  databaseURL: "https://thepaliocalculator-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "thepaliocalculator",
  storageBucket: "thepaliocalculator.firebasestorage.app",
  messagingSenderId: "784232052639",
  appId: "1:784232052639:web:8da9d6360cffdaf1e1afaa",
  measurementId: "G-G62FQCK7MV"
};
const CLOUD_PATH = 'palio2026';
// SHA-256 della password admin (nel sorgente c'è solo l'hash, non la password)
const ADMIN_HASH = '1d6f1c6e5cadfe038e46365ac26fbbfb8323af3e23ad4d5665ae020dee3b117f';

let db=null, cloudOn=false, cloudConnected=false, applyingRemote=false, cloudInited=false;
const myId = 'c'+Math.random().toString(36).slice(2,10);
let isAdmin = false;
// se il cloud è attivo si modifica solo da admin; in locale (senza cloud) si modifica liberamente
const canEdit = () => isAdmin || !cloudOn;
const ED = () => canEdit() ? '' : 'disabled';

// normalizza i dati che arrivano da Firebase (array<->oggetto, pos mancanti)
function normalizeState(s){
  if(!s || typeof s!=='object') return null;
  if(s.gare && !Array.isArray(s.gare)) s.gare = Object.values(s.gare);
  if(s.contrade && !Array.isArray(s.contrade)) s.contrade = Object.values(s.contrade);
  if(s.tabellaPunti) for(const k in s.tabellaPunti){ const v=s.tabellaPunti[k]; if(v && !Array.isArray(v)) s.tabellaPunti[k]=Object.values(v); }
  return s;
}

function initCloud(){
  if(cloudInited) return; cloudInited=true;
  if(typeof firebase==='undefined' || !FIREBASE_CONFIG.databaseURL){ updateTopbar(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    cloudOn = true;
    db.ref('.info/connected').on('value', s=>{ cloudConnected=(s.val()===true); updateTopbar(); });
    db.ref(CLOUD_PATH+'/state').on('value', snap=>{
      const remote = snap.val();
      if(remote && remote.data){
        if(remote.updatedBy === myId) return;           // è il nostro stesso aggiornamento (eco)
        const s = migrate(normalizeState(remote.data));
        if(s){
          applyingRemote = true;
          state = s;
          saveLocal();                                  // backup locale
          render();
          if(document.getElementById('present').classList.contains('on')) renderPresent();
          applyingRemote = false;
        }
      } else if(isAdmin){
        pushCloud();                                     // database vuoto: l'admin lo inizializza
      }
    }, err=>console.warn('cloud read err', err));
  }catch(e){ cloudOn=false; console.warn('cloud init fail', e); }
  updateTopbar();
}
let cloudTimer=null;
function pushCloud(){
  if(!cloudOn || !isAdmin || !db) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(()=>{
    db.ref(CLOUD_PATH+'/state').set({
      data: state, updatedBy: myId, updatedAt: firebase.database.ServerValue.TIMESTAMP
    }).catch(e=>console.warn('cloud write err', e));
  }, 250);
}

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function promptAdmin(){
  if(isAdmin){
    if(confirm('Vuoi uscire dalla modalità admin e tornare in sola visione?')){
      isAdmin=false; localStorage.removeItem('palioAdmin'); updateTopbar(); render(); badge(cloudOn?'view':'ok');
    }
    return;
  }
  const pw = prompt('Password admin per inserire/modificare i punteggi:');
  if(pw==null) return;
  if(await sha256(pw) === ADMIN_HASH){
    isAdmin=true; localStorage.setItem('palioAdmin','1');
    updateTopbar(); render(); badge('ok');
    if(cloudOn && db) db.ref(CLOUD_PATH+'/state').once('value').then(s=>{ if(!(s.val()&&s.val().data)) pushCloud(); });
  } else {
    alert('Password errata.');
  }
}
function updateTopbar(){
  const cb=document.getElementById('cloudBadge'), ab=document.getElementById('adminBtn');

/* ===================== FUNZIONI PURE DI CALCOLO ===================== */
const contrada = cid => state.contrade.find(c=>c.id===cid);
const coeff = cid => contrada(cid).coeff;
function puntiPalio(g, cid){
  const p = g.pos[cid];
  if(p==null) return 0;
  const arr = state.tabellaPunti[g.tipo];
  return arr ? (Number(arr[p-1])||0) : 0;
}
const puntiDrappo = (g, cid) => puntiPalio(g, cid) * coeff(cid);
const disputata = g => state.contrade.some(c => g.pos[c.id]!=null);

// somme cumulative su gare disputate, in ordine
function calcola(){
  const disp = state.gare.filter(disputata);
  const palio = {}, drappo = {}, totP = {}, totD = {};
  state.contrade.forEach(c=>{ palio[c.id]=[]; drappo[c.id]=[]; totP[c.id]=0; totD[c.id]=0; });
  disp.forEach(g=>{
    state.contrade.forEach(c=>{
      totP[c.id]+=puntiPalio(g,c.id);
      totD[c.id]+=puntiDrappo(g,c.id);
      palio[c.id].push(totP[c.id]);
      drappo[c.id].push(totD[c.id]);
    });
  });
  return {disp, palio, drappo, totP, totD};
}
// classifica con ranking 1-2-2-4 (pareggio su valore arrotondato a 2 dec)
function classifica(tipo){
  const {totP,totD} = calcola();
  const tot = tipo==='palio' ? totP : totD;
  const arr = state.contrade.map(c=>({c, val:tot[c.id]}));
  arr.sort((a,b)=> (b.val-a.val) || a.c.nome.localeCompare(b.c.nome,'it'));
  let prev=null;
  arr.forEach((e,i)=>{
    const rv = Math.round(e.val*100)/100;
    if(i>0 && Math.abs(rv-prev)<0.005){ e.rank = arr[i-1].rank; }
    else { e.rank = i+1; }
    prev = rv;
  });
  return arr;
}

const fmtD = n => (Math.round(n*100)/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtCoeff = n => n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
const medal = r => r===1?'🥇':r===2?'🥈':r===3?'🥉':'';

function viewClassifica(tipo){
  const arr = classifica(tipo);
  const max = Math.max(1, ...arr.map(e=>e.val));
  const isDr = tipo==='drappo';
  const rows = arr.map(e=>{
    const cls = e.rank===1?'p1':e.rank===2?'p2':e.rank===3?'p3':'';
    const val = isDr ? fmtD(e.val) : fmtP(e.val);
    const sub = isDr ? `coeff. ${fmtCoeff(e.c.coeff)}` : '';
    return `<div class="srow ${cls}" style="--cc:${e.c.chart}">
      <div class="rank">${e.rank}<span class="medal">${medal(e.rank)}</span></div>
      <div><div class="nome" style="color:${e.c.chart}">${esc(e.c.nome)}</div>
        ${sub?`<div class="sub">${sub}</div>`:''}
        <div class="bar" style="width:${Math.max(4,e.val/max*100)}%;background:linear-gradient(90deg,${e.c.c1},${e.c.c2})"></div></div>
      <div class="tot">${val}</div>

  return `<div class="card">

    <p class="hint">Ordinamento per punti decrescenti. A parità di punti le contrade condividono la posizione (es. 1-2-2-4); l'ordine alfabetico è solo indicativo.
      ${isDr?'Drappo = punti Palio × coefficiente della contrada.':''}</p>

}

function drawCharts(){
  const {disp,palio,drappo} = calcola();
  if(disp.length===0) return;
  const labels = disp.map((g,i)=>`${i+1}. ${g.sport}${g.categoria?(' '+g.categoria):''}`);
  const mk = c => ({id:c.id, nome:c.nome, color:c.chart, c1:c.c1, c2:c.c2});
  const seriesP = state.contrade.map(c=>({...mk(c), data:palio[c.id]}));
  const seriesD = state.contrade.map(c=>({...mk(c), data:drappo[c.id]}));
  const ep = document.getElementById('chartPalio');
  const ed = document.getElementById('chartDrappo');
  if(ep) ep.innerHTML = lineChartSVG(seriesP, labels, false, 'p');
  if(ed) ed.innerHTML = lineChartSVG(seriesD, labels, true, 'd');
}
function lineChartSVG(series, labels, decimals, key){
  const W=820, H=380, pad={l:48,r:18,t:18,b:64};
  key = key||'c';
  // gradienti per contrada: i due colori si mischiano lungo la linea
  const defs = '<defs>'+series.map(s=>
    `<linearGradient id="ln_${key}_${s.id}" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0%" stop-color="${s.c1}"/><stop offset="100%" stop-color="${s.c2}"/></linearGradient>`
  ).join('')+'</defs>';
  const n = labels.length;
  const allMax = Math.max(1, ...series.flatMap(s=>s.data));
  // scala "carina" per l'asse Y
  const step = niceStep(allMax/5);
  const yMax = Math.ceil(allMax/step)*step || step;
  const xOf = i => pad.l + (n<=1 ? (W-pad.l-pad.r)/2 : (i/(n-1))*(W-pad.l-pad.r));
  const yOf = v => H-pad.b - (v/yMax)*(H-pad.t-pad.b);
  let g='';
  // griglia + etichette Y
  for(let v=0; v<=yMax+1e-9; v+=step){
    const y=yOf(v);
    g+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#30363d" stroke-width="1"/>`;
    g+=`<text x="${pad.l-6}" y="${(y+4).toFixed(1)}" fill="#8b949e" font-size="11" text-anchor="end">${decimals?fmtD(v):fmtP(v)}</text>`;
  }
  // etichette X (mostra alcune per non affollare)
  const everyX = Math.ceil(n/10);
  labels.forEach((lab,i)=>{
    if(i%everyX!==0 && i!==n-1) return;
    const x=xOf(i);
    g+=`<text x="${x.toFixed(1)}" y="${H-pad.b+16}" fill="#8b949e" font-size="10" text-anchor="end" transform="rotate(-35 ${x.toFixed(1)} ${H-pad.b+16})">${esc(String(i+1))}</text>`;
  });
  g+=`<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}" stroke="#484f58"/>`;
  g+=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="#484f58"/>`;
  // linee per contrada
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    if(n>1) g+=`<polyline points="${pts}" fill="none" stroke="url(#ln_${key}_${s.id})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.data.forEach((v,i)=>{
      g+=`<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${n>30?2.5:3.6}" fill="${s.color}" stroke="#0d1117" stroke-width="0.8">
        <title>${esc(s.nome)} — dopo ${esc(labels[i])}: ${decimals?fmtD(v):fmtP(v)}</title></circle>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${defs}${g}</svg>`;
}
function niceStep(x){
  if(x<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(x)));
  const f=x/p;
  return (f<=1?1:f<=2?2:f<=5?5:10)*p;
}

      <button class="btn" data-action="export-csv">⬇ Esporta CSV (Excel)</button>
      ${canEdit()?'<button class="btn" data-action="import-json">⬆ Importa JSON</button>':''}
      ${canEdit()?'<button class="btn danger" data-action="reset-all">↺ Ripristina valori predefiniti</button>':''}
    </div>
    <p class="hint">Il salvataggio è automatico in questo browser. Usa <b>Esporta JSON</b> per un backup completo o per spostare i dati su un altro dispositivo.
      Il <b>CSV</b> si apre direttamente in Excel (separatore «;», decimali con la virgola).</p>
  </div>`;
}

/* ===================== PRESENTAZIONE ===================== */
let presentMode = 'palio';
function openPresent(){
  document.getElementById('present').classList.add('on');
  renderPresent();
  if(document.documentElement.requestFullscreen){ try{ document.documentElement.requestFullscreen(); }catch(e){} }
}
function closePresent(){
  document.getElementById('present').classList.remove('on');
  if(document.fullscreenElement && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} }
}
function renderPresent(){
  const tipo = presentMode;
  document.getElementById('presTitle').textContent = tipo==='drappo'?'Classifica Drappo':'Classifica Palio';
  document.getElementById('pmPalio').className = 'btn'+(tipo==='palio'?' gold':'');
  document.getElementById('pmDrappo').className = 'btn'+(tipo==='drappo'?' gold':'');
  const arr = classifica(tipo);
  const isDr = tipo==='drappo';
  const fv = e => isDr?fmtD(e.val):fmtP(e.val);
  // podio (primi 3 per posizione)
  const top3 = arr.filter(e=>e.rank<=3);
  const byRank = r => top3.filter(e=>e.rank===r);
  const podBlock = (e, h, label) => `<div class="pcol">
      <div class="pname" style="color:${e.c.chart}">${esc(e.c.nome)}</div>
      <div class="pscore">${fv(e)}</div>
      <div class="block" style="height:${h}px;background:linear-gradient(180deg,${e.c.c1},${e.c.c2})">${label}</div></div>`;
  const ord = [].concat(byRank(2), byRank(1), byRank(3)); // 2 - 1 - 3
  const hMap = {1:150,2:110,3:80};
  const podium = `<div class="podium">${ord.map(e=>podBlock(e,hMap[e.rank],e.rank)).join('')}</div>`;
  const big = `<div class="bigstand">${arr.map(e=>`
    <div class="br" style="--cc:${e.c.chart}">
      <div class="r">${e.rank}${medal(e.rank)}</div>
      <div class="n" style="color:${e.c.chart}">${esc(e.c.nome)}</div>
      <div class="t">${fv(e)}</div>
    </div>`).join('')}</div>`;
  document.getElementById('presBody').innerHTML = podium + big;
}

/* ===================== EXPORT / IMPORT ===================== */
function download(filename, text, mime){
  const blob = new Blob([text], {type:mime||'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
function exportJSON(){
  download('Palio2026_punteggio.json', JSON.stringify(state,null,2), 'application/json;charset=utf-8');
}
function exportCSV(){
  const {totP,totD,disp} = calcola();
  const C = state.contrade;
  const SEP=';';
  const dec = n => String(n).replace('.',',');
  const lines = [];
  lines.push('PALIO 2026 - CALCOLO PUNTEGGIO');
  lines.push('');
  // classifica palio
  lines.push('CLASSIFICA PALIO');
  lines.push(['Pos','Contrada','Punti'].join(SEP));
  classifica('palio').forEach(e=>lines.push([e.rank, e.c.nome, fmtP(e.val)].join(SEP)));
  lines.push('');
  lines.push('CLASSIFICA DRAPPO');
  lines.push(['Pos','Contrada','Coeff','Punti'].join(SEP));
  classifica('drappo').forEach(e=>lines.push([e.rank, e.c.nome, dec(fmtCoeff(e.c.coeff)), dec(fmtD(e.val))].join(SEP)));
  lines.push('');
  // dettaglio punti palio per gara
  lines.push('PUNTI PALIO PER GARA');
  lines.push(['#','Sport','Categoria','Tipo', ...C.map(c=>c.nome)].join(SEP));
  state.gare.forEach((g,i)=>{
    const cells = C.map(c=> g.pos[c.id]==null ? '' : fmtP(puntiPalio(g,c.id)));
    lines.push([i+1, g.sport, g.categoria, g.tipo, ...cells].join(SEP));
  });
  lines.push(['','','','TOTALE', ...C.map(c=>fmtP(totP[c.id]))].join(SEP));
  lines.push('');
  // dettaglio punti drappo per gara
  lines.push('PUNTI DRAPPO PER GARA');
  lines.push(['#','Sport','Categoria','Tipo', ...C.map(c=>c.nome)].join(SEP));
  state.gare.forEach((g,i)=>{
    const cells = C.map(c=> g.pos[c.id]==null ? '' : dec(fmtD(puntiDrappo(g,c.id))));
    lines.push([i+1, g.sport, g.categoria, g.tipo, ...cells].join(SEP));
  });
  lines.push(['','','','TOTALE', ...C.map(c=>dec(fmtD(totD[c.id])))].join(SEP));
  const BOM='﻿';
  download('Palio2026_punteggio.csv', BOM+lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function importJSON(){
  document.getElementById('importFile').click();
}
function handleImport(file){
  const r = new FileReader();
  r.onload = e => {
    try{
      const s = migrate(JSON.parse(e.target.result));
      if(!s) throw new Error('formato non valido');
      state = s; save(); render();
      alert('Dati importati correttamente.');
    }catch(err){
      alert('File non valido: '+err.message);
    }
  };
  r.readAsText(file);
}

/* ===================== EVENTI ===================== */
function findGara(gid){ return state.gare.find(g=>g.id===gid); }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;
  if(['reset-all','gara-add','gara-del','gara-up','gara-down','import-json'].includes(a) && !canEdit()) return;
  switch(a){
    case 'nav':
      if(t.dataset.view==='present'){ openPresent(); return; }
      current = t.dataset.view; render(); window.scrollTo({top:0});
      break;
    case 'present-close': closePresent(); break;
    case 'present-mode': presentMode = t.dataset.mode; renderPresent(); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-json': importJSON(); break;
    case 'reset-all':
      if(confirm('Ripristinare tutti i valori predefiniti?\n\nQuesto cancella TUTTI i risultati inseriti e ripristina contrade, tabella punti ed elenco gare.')){
        state = defaults(); save(); render();
      }
      break;
    case 'gara-add':
      state.gare.push({id:uid(), sport:'Nuova gara', categoria:'', tipo:'Punti 4', pos:emptyPos()});
      save(); render();
      break;
    case 'gara-del': {
      const g = findGara(t.dataset.gid);
      if(g && confirm('Eliminare la gara "'+g.sport+(g.categoria?' '+g.categoria:'')+'"?')){
        state.gare = state.gare.filter(x=>x.id!==t.dataset.gid); save(); render();
      }
      break; }
    case 'gara-up': moveGara(t.dataset.gid,-1); break;
    case 'gara-down': moveGara(t.dataset.gid,1); break;
  }
});
function moveGara(gid, dir){
  const i = state.gare.findIndex(g=>g.id===gid);
  const j = i+dir;
  if(i<0||j<0||j>=state.gare.length) return;
  const arr=state.gare; [arr[i],arr[j]]=[arr[j],arr[i]];
  save(); render();
}

document.addEventListener('change', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;
  if(['pos','tipo','cfg-cont','cfg-punti','cfg-gara'].includes(a) && !canEdit()){ render(); return; }
  if(a==='pos'){
    const g = findGara(t.dataset.gid);
    g.pos[t.dataset.cid] = t.value==='' ? null : parseInt(t.value,10);
    save(); render();
  }
  else if(a==='tipo'){
    findGara(t.dataset.gid).tipo = t.value; save(); render();
  }
  else if(a==='cfg-cont'){
    const c = contrada(t.dataset.cid), f=t.dataset.f;
    if(f==='coeff'){ const v=parseFloat(String(t.value).replace(',','.')); if(!isNaN(v)) c.coeff=v; }
    else c[f]=t.value;
    save();
    if(f==='coeff') render(); // i valori dipendono dal coeff
  }
  else if(a==='cfg-punti'){
    const v = parseFloat(String(t.value).replace(',','.'));
    state.tabellaPunti[t.dataset.tipo][parseInt(t.dataset.idx,10)] = isNaN(v)?0:v;
    save();
  }
  else if(a==='cfg-gara'){
    const g = findGara(t.dataset.gid);
    g[t.dataset.f] = t.value;
    save();
    if(t.dataset.f==='tipo') { /* niente re-render: select già aggiornato */ }
  }
  else if(t.id==='importFile'){ /* gestito sotto */ }
});

document.getElementById('importFile').addEventListener('change', function(){
  if(this.files && this.files[0]) handleImport(this.files[0]);
  this.value='';
});

// scorciatoie presentazione
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closePresent();
});

/* ===================== AUTOTEST (console) ===================== */
function selfTest(){
  // scenario noto: tutte le contrade 5ª con tipo Punti B -> 1 punto Palio ciascuna, Drappo = coeff
  const bak = JSON.stringify(state);
  state = defaults();
  const g = state.gare.find(x=>x.tipo==='Punti B') || state.gare[0];
  g.tipo='Punti B';
  state.contrade.forEach(c=> g.pos[c.id]=5);
  const okPalio = state.contrade.every(c=> puntiPalio(g,c.id)===1);
  const okDr = Math.abs(puntiDrappo(g,'sagittario') - 2) < 1e-9
            && Math.abs(puntiDrappo(g,'andromeda') - 3.33) < 1e-9;
  // 1ª posto Punti 5 = 10
  g.tipo='Punti 5'; g.pos.bosco=1;
  const okP5 = puntiPalio(g,'bosco')===10;
  state = JSON.parse(bak);
  console.log('%cAutotest calcolo:', 'color:#d4af37',
    okPalio&&okDr&&okP5 ? 'OK ✓' : 'FALLITO ✗', {okPalio, okDr, okP5});
}
